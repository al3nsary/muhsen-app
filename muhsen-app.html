/* ============================ الإشعارات ============================ */
/* تصنيف الإشعار: يحدّد لونه وأيقونته ووسمه */
const NKIND = [
  { k:'bad',   c:'#C0392B', i:'i-warn',   t:'يحتاج إجراءً',
    re:/تأخر|تأخرت|تخلّف|رفض|رُفض|أُزلت|أُلغيت|بدأها النظام|تجاوزت|خارج النطاق/ },
  { k:'ask',   c:'#B8791A', i:'i-assign', t:'بانتظار ردّك',
    re:/طلب|تسكين|تفويض|إسناد|تبديل|بلا رد|تحتاج|راجع/ },
  { k:'ok',    c:'#0B8A4B', i:'i-checkc', t:'تمّ',
    re:/قبول|قبِل|اعتُمد|اكتمل|أثبت|حضّر|أُغلقت|أُنجزت|تحضير/ },
  { k:'info',  c:'#1B6E9C', i:'i-info',   t:'معلومة',
    re:/صورة|تذكرة|رُفع|الكنترول|تذكير|فُتحت|جديدة|بدأت/ }
];
function nkind(n) {
  const s = (n.title || '') + ' ' + (n.body || '');
  for (const k of NKIND) if (k.re.test(s)) return k;
  return NKIND[3];
}
const dayLabel = ts => {
  const d = dayStart(ts), t0 = dayStart(now());
  if (d === t0) return 'اليوم';
  if (d === t0 - DAY) return 'أمس';
  if (d > t0 - 7 * DAY) return dayName(ts);
  return hijri(ts);
};

function notifRow(n) {
  const k = nkind(n);
  return '<button class="nrow ' + (n.read ? 'read' : '') + '" style="--nc:' + k.c + '" ' +
    'data-a="opennotif" data-id="' + n.id + '">' +
    '<span class="ni">' + icon(n.icon || k.i, 's18') + '</span>' +
    '<span class="nb"><b>' + E(n.title) + '</b>' +
      '<p>' + E(n.body) + '</p>' +
      '<span class="nm2"><span class="ntag">' + k.t + '</span>' +
      '<span class="nt">' + t12(n.at) + ' · ' + ago(n.at) + '</span></span></span>' +
    (n.read ? '' : '<span class="nd"></span>') + '</button>';
}

function screenNotifs() {
  const all = myNotifs().slice().sort((a2, b2) => b2.at - a2.at);
  const seg = S.tab.nf || 'all';
  const unreadN = all.filter(n => !n.read).length;
  const needs = all.filter(n => ['bad', 'ask'].indexOf(nkind(n).k) >= 0).length;
  const list = seg === 'unread' ? all.filter(n => !n.read)
    : seg === 'act' ? all.filter(n => ['bad', 'ask'].indexOf(nkind(n).k) >= 0)
    : all;

  /* تجميع بالأيام — القراءة تصير متسلسلة لا كومة */
  let out = '', lastDay = null;
  list.forEach(n => {
    const d = dayStart(n.at);
    if (d !== lastDay) {
      lastDay = d;
      out += '<div class="nday"><b>' + dayLabel(n.at) + '</b><i></i></div>';
    }
    out += notifRow(n);
  });

  return bar('الإشعارات', { right: unreadN
      ? '<button data-a="readall" aria-label="تعليم الكل كمقروء">' + icon('i-check') + '</button>'
      : '<button data-a="go" data-n="profile" class="avbtn">' + avat(me(), 'sm') + '</button>' }) +
    '<div class="view">' + ground() +

    '<div class="nsum">' +
      '<button class="' + (seg === 'all' ? 'on' : '') + '" data-a="seg" data-k="nf" data-v="all">' +
        '<b>' + AR(all.length) + '</b><span>الكل</span></button>' +
      '<button class="' + (seg === 'unread' ? 'on' : '') + '" data-a="seg" data-k="nf" data-v="unread">' +
        '<b style="color:var(--g)">' + AR(unreadN) + '</b><span>غير مقروء</span></button>' +
      '<button class="' + (seg === 'act' ? 'on' : '') + '" data-a="seg" data-k="nf" data-v="act">' +
        '<b style="color:var(--red)">' + AR(needs) + '</b><span>يحتاج إجراءً</span></button>' +
    '</div>' +

    (unreadN ? '<button class="btn l sm" data-a="readall">' + icon('i-check','s16') +
      'تعليم الكل كمقروء</button>' : '') +

    (list.length ? out
      : '<div class="c center" style="padding:34px 16px">' + icon('i-bell','s26') +
        '<b style="display:block;margin-top:10px">' +
        (seg === 'unread' ? 'قرأت كل شيء' : seg === 'act' ? 'لا شيء ينتظر إجراءً' : 'لا توجد إشعارات') +
        '</b><div class="sm dim" style="margin-top:6px">ستصلك التحديثات هنا أولًا بأول.</div></div>') +
    '</div>' + tabs();
}

/* ============================ التقويم ============================ */
const D_SHORT = ['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];

function screenCalendar() {
  const list = myTasks();
  S.reminders = S.reminders || [];
  const mine = S.reminders.filter(r => r.who === S.session.id);
  const today = dayStart(now());
  if (S.calWeek == null) S.calWeek = 0;
  if (S.calDay == null) S.calDay = today;
  const weekStart = dayStart(today + S.calWeek * 7 * DAY) - (new Date(today).getDay() * DAY);
  const days = Array.from({ length: 7 }, (_, i) => weekStart + i * DAY);
  const tasksOn = d => list.filter(t => dayStart(t.start) === d);
  const remsOn = d => mine.filter(r => dayStart(r.at) === d);
  const sel = S.calDay;
  const selTasks = tasksOn(sel).sort((a, b) => a.start - b.start);
  const selRems = remsOn(sel).sort((a, b) => a.at - b.at);

  return bar('التقويم', { right:'<button data-a="addrem" aria-label="تذكير جديد">' + icon('i-plus') + '</button>' }) +
    '<div class="view">' + ground() +
    '<div class="c"><div class="row">' +
      '<button data-a="week" data-v="1" class="navbtn">' + icon('i-fwd','s18') + '</button>' +
      '<div class="center sp"><b style="font-size:14px">' + hijri(weekStart) + ' — ' + hijri(weekStart + 6 * DAY) + '</b>' +
        '<div class="tiny dim2">' + greg(weekStart) + ' إلى ' + greg(weekStart + 6 * DAY) + '</div></div>' +
      '<button data-a="week" data-v="-1" class="navbtn">' + icon('i-back','s18') + '</button></div>' +
    '<div class="week">' + days.map(d => {
      const n = tasksOn(d).length, rn = remsOn(d).length;
      const on = d === sel, isToday = d === today;
      const hot = tasksOn(d).some(t => { const u = urgency(t); return u && u.c === 'r'; });
      return '<button data-a="calday" data-v="' + d + '" class="day' + (on ? ' on' : isToday ? ' today' : '') + '">' +
        '<span class="dn">' + D_SHORT[new Date(d).getDay()] + '</span>' +
        '<span class="dd">' + AR(new Date(d).getDate()) + '</span>' +
        '<span class="dots">' + (n ? '<i class="' + (hot ? 'r' : 'g') + '"></i>' : '') + (rn ? '<i class="a"></i>' : '') + '</span></button>';
    }).join('') + '</div>' +
    '<div class="row tiny dim2" style="margin-top:9px">' +
      '<span><i class="lg g"></i> مهام &nbsp; <i class="lg a"></i> تذكيرات</span>' +
      (S.calWeek !== 0 ? '<button data-a="week" data-v="0" style="color:var(--g);font-weight:700">هذا الأسبوع</button>'
        : '<span>' + AR(list.length) + ' مهمة إجمالًا</span>') + '</div></div>' +

    '<div class="lbl">' + dayName(sel) + ' · ' + hijri(sel) +
      '<small>' + greg(sel) + ' · ' + AR(selTasks.length) + ' مهمة · ' + AR(selRems.length) + ' تذكير</small></div>' +

    (selRems.length ? selRems.map(r =>
      '<div class="note ' + (r.fired ? 'g' : 'a') + '">' + icon('i-bell','s16') +
        '<span class="sp">' + E(r.text) + '<br><span class="tiny" style="opacity:.8">' + t12(r.at) +
        (r.fired ? ' · وصلك الإشعار' : ' · بانتظار الوقت') + '</span></span>' +
        '<button data-a="delrem" data-id="' + r.id + '" style="color:#93261C">' + icon('i-x','s16') + '</button></div>').join('') : '') +

    (selTasks.length ? selTasks.map(t => taskRow(t)).join('')
      : '<div class="c center dim sm" style="padding:22px">لا توجد مهام في هذا اليوم</div>') +

    '<button class="btn l" data-a="addrem">' + icon('i-bell','s16') + 'تذكير على ' + dayName(sel) + ' ' + hijri(sel) + '</button>' +
    '</div>' + tabs();
}

/* ============================ مركز الطلبات — للدورين ============================ */
const REQST = { pending:['بانتظار الرد','wait'], accepted:['مقبول','live'],
  rejected:['مرفوض','no'], withdrawn:['مسحوب','grey'] };

function reqCardFull(r, actionable) {
  const t = reqTask(r);
  const from = userById(r.from), to = userById(r.to);
  if (!from || !to) return '';
  const st = REQST[r.state] || [r.state, 'grey'];
  const urgent = r.state === 'pending' && t && t.start - now() < 3 * HR && t.start > now();
  const phone = to.phone ? to.phone.replace(/[^0-9]/g, '') : '';

  return '<div class="c ' + (urgent ? 'urgent' : '') + '">' +
    '<div class="row"><b style="font-size:14px">طلب ' + E(r.kind) + '</b>' + pill(st[0], st[1]) + '</div>' +

    '<div class="flow2">' +
      '<span class="who">' + avat(from, 'sm') + '<span class="tiny"><b>' + E(from.name) + '</b>' +
        '<span class="dim2">من · ' + (from.role === 'leader' ? 'ليدر' : 'مُحسن') + '</span></span></span>' +
      '<span class="arrow">' + icon('i-back','s16') + '</span>' +
      '<span class="who">' + avat(to, 'sm') + '<span class="tiny"><b>' + E(to.name) + '</b>' +
        '<span class="dim2">إلى · ' + (to.role === 'leader' ? 'ليدر' : 'مُحسن') + '</span></span></span>' +
    '</div>' +

    (t ? '<button class="fl reqtask" data-a="go" data-n="task" data-id="' + t.id + '">' +
        '<span class="thumb bg-' + t.photo + '" style="width:40px;height:40px"></span>' +
        '<span class="sp" style="text-align:right"><b class="tiny" style="display:block">' + E(t.title) + '</b>' +
        '<span class="tiny dim2">' + hijri(t.start) + ' · ' + t12(t.start) + '</span></span>' + icon('i-back','s16') + '</button>' : '') +

    '<div class="row tiny dim2" style="margin-top:9px">' +
      '<span>أُرسل ' + t12(r.at) + ' · ' + hijri(r.at) + '</span>' +
      (r.respAt ? '<span>الرد ' + t12(r.respAt) + '</span>' : '<span>' + ago(r.at) + '</span>') + '</div>' +

    (r.note ? '<div class="note a" style="margin-top:9px">' + icon('i-edit','s16') +
      '<span>ملاحظة المرسِل: ' + E(r.note) + '</span></div>' : '') +
    (r.respNote ? '<div class="note ' + (r.state === 'rejected' ? 'r' : 'g') + '" style="margin-top:8px">' +
      icon('i-info','s16') + '<span>رد المستقبِل: ' + E(r.respNote) + '</span></div>' : '') +
    (r.respPhoto ? excuseChip(r.respPhoto) : '') +
    (urgent ? '<div class="strip r">' + icon('i-warn','s16') + '<span>بقي أقل من ٣ ساعات على المهمة</span></div>' : '') +

    (actionable && r.state === 'pending' && t ? (
      r.kind === 'تسكين'
        ? '<div class="grid2" style="margin-top:10px">' +
          '<button class="btn d sm" data-a="resp" data-id="' + t.id + '" data-v="0">رفض</button>' +
          '<button class="btn p sm" data-a="resp" data-id="' + t.id + '" data-v="1">قبول</button></div>'
        : '<div class="grid2" style="margin-top:10px">' +
          '<button class="btn d sm" data-a="rdeleg" data-id="' + t.id + '" data-v="0">رفض</button>' +
          '<button class="btn p sm" data-a="rdeleg" data-id="' + t.id + '" data-v="1">قبول</button></div>') : '') +

    (!actionable && r.state === 'pending' && r.from === S.session.id && t && !lockedForAssign(t) ?
      '<div class="grid3" style="margin-top:10px">' +
        (phone ? '<a class="btn l sm" href="tel:' + phone + '">' + icon('i-phone','s16') + 'اتصال</a>' +
                 '<a class="btn l sm" href="https://wa.me/' + phone + '" target="_blank" rel="noopener">' + icon('i-send','s16') + 'واتساب</a>' : '') +
        '<button class="btn d sm" data-a="withdraw" data-id="' + t.id + '" data-u="' + r.to + '">' + icon('i-x','s16') + 'سحب</button>' +
      '</div>' : '') +
  '</div>';
}

function screenReqCenter() {
  const uid_ = S.session.id;
  const all = S.requests.slice();
  const inbox = all.filter(r => r.to === uid_ && r.state === 'pending');
  const sent = all.filter(r => r.from === uid_);
  const recv = all.filter(r => r.to === uid_);
  const done = all.filter(r => (r.from === uid_ || r.to === uid_) && r.state !== 'pending');
  const mine = all.filter(r => r.from === uid_ || r.to === uid_);
  const seg = S.tab.rq || (inbox.length ? 'inbox' : 'sent');
  const list = seg === 'inbox' ? inbox : seg === 'sent' ? sent : seg === 'recv' ? recv
    : seg === 'done' ? done : mine;

  return bar('الطلبات') + '<div class="view">' + ground() +
    '<div class="grid3">' +
      '<div class="kpi"><b style="color:var(--amber)">' + AR(inbox.length) + '</b><span>بانتظار ردي</span></div>' +
      '<div class="kpi"><b>' + AR(sent.length) + '</b><span>مرسلة</span></div>' +
      '<div class="kpi"><b style="color:var(--dim)">' + AR(done.length) + '</b><span>منتهية</span></div></div>' +

    '<div class="seg">' +
      [['inbox','بانتظار ردي'],['sent','المرسلة'],['recv','المستقبلة'],['done','المنتهية'],['all','الكل']]
        .map(x => '<button class="' + (seg === x[0] ? 'on' : '') + '" data-a="seg" data-k="rq" data-v="' + x[0] + '">' + x[1] + '</button>').join('') +
    '</div>' +

    (list.length ? list.map(r => reqCardFull(r, r.to === uid_ && r.state === 'pending')).join('')
      : '<div class="c center" style="padding:26px"><b>لا توجد طلبات في هذا التصنيف</b>' +
        '<div class="sm dim" style="margin-top:6px">' +
          (isLeader() ? 'ابدأ التسكين من شاشة المهام.' : 'ستصلك طلبات الليدر هنا.') + '</div>' +
        (isLeader() ? '<button class="btn l sm" style="margin-top:12px" data-a="go" data-n="tasks">' +
          icon('i-tasks','s16') + 'فتح المهام</button>' : '') + '</div>') +
    '</div>' + tabs();
}

/* ============================ الصور — تصوير مباشر من داخل التطبيق ============================ */
/* الليدر وحده يصوّر · الصور تُربط بمهمة رئيسية أو فرعية أو تذكرة
   · يراها كل من له صلاحية الوصول للمهمة، حتى بعد انتهائها */

const MAX_PHOTO_W = 900;     /* أقصى عرض بعد الضغط */
const PHOTO_Q = 0.62;        /* جودة JPEG */
const PHOTO_CAP = 60;        /* أقصى عدد صور محفوظة محليًا */

/* المبذورة تُرسم بصنف CSS (لا تُحمَّل مرتين)، والملتقطة برابطها */
const fullTag = (p, cls) => (String(p.src).indexOf('IMG:') === 0
  ? '<div class="' + cls + ' bgw-' + String(p.src).slice(4).replace(/_w$/, '') + '" role="img"></div>'
  : '<img class="' + cls + '" src="' + p.src + '" alt="">');
/* المصغّرة: نسخة أصغر للصور المبذورة حتى لا يثقُل الألبوم */
const seeded = p => String(p.src).indexOf('IMG:') === 0;
const thumbKey = p => String(p.src).slice(4).replace(/_w$/, '');

const thumbAttr = p => seeded(p)

function shortTitle(s) {
  let x = String(s).split(' — ')[0].trim();
  return x.length > 15 ? x.slice(0, 15).trim() + '…' : x;
}

function photosFor(taskId, subId, ticketId) {
  S.photos = S.photos || [];
  return S.photos.filter(p => !p.excuse &&
    (taskId ? p.taskId === taskId : true) &&
    (subId !== undefined ? p.subId === subId : true) &&
    (ticketId !== undefined ? p.ticketId === ticketId : true)
  ).sort((a, b) => b.at - a.at);
}
const taskPhotos = tid => (S.photos || []).filter(p => p.taskId === tid).sort((a, b) => b.at - a.at);

function addPhoto(src, title, desc, ctx) {
  S.photos = S.photos || [];
  const p = {
    id: uid('F'), src, title: title, desc: desc || '',
    by: S.session.id, at: now(),
    taskId: ctx.taskId || null, subId: ctx.subId || null, ticketId: ctx.ticketId || null
  };
  S.photos.unshift(p);
  while (S.photos.length > PHOTO_CAP) {
    const i = S.photos.map((x, k) => ({ x, k })).reverse().find(o => o.x.src.indexOf('IMG:') !== 0);
    if (!i) break;
    S.photos.splice(i.k, 1);
  }
  const t = ctx.taskId ? taskById(ctx.taskId) : null;
  if (t) {
    const sub = ctx.subId ? t.subs.find(s => s.id === ctx.subId) : null;
    hist(t, 'أرفق ' + me().name + ' صورة' + (sub ? ' على «' + sub.name + '»' : '') + ' — ' + title);
    acceptedSlots(t).forEach(a => notify(a.muhsenId, 'i-camera', 'صورة جديدة على المهمة',
      '«' + t.title + '» — ' + title, { n: 'album', id: t.id }));
  }
  if (ctx.ticketId) {
    const k = S.tickets.find(x => x.id === ctx.ticketId);
    if (k) k.replies.push({ by: S.session.id, text: 'أُرفقت صورة: ' + title, at: now(), sys: true });
  }
  return p;
}
function deletePhoto(id) {
  S.photos = (S.photos || []).filter(p => p.id !== id);
}

  const list = photosFor(ctx.taskId, ctx.subId === undefined ? null : ctx.subId,
    ctx.ticketId === undefined ? null : ctx.ticketId);
  const can = canShoot();
  if (!list.length && !can) return '';
  const ctxAttr = 'data-tid="' + (ctx.taskId || '') + '" data-sid="' + (ctx.subId || '') +
    '" data-kid="' + (ctx.ticketId || '') + '"';
  return '<div class="pstrip">' +
    (label ? '<div class="tiny dim2" style="margin-bottom:7px">' + E(label) +
      (list.length ? ' · ' + AR(list.length) + ' صورة' : '') + '</div>' : '') +
    '<div class="pscroll">' +
      (can ? '<button class="padd" data-a="shoot" ' + ctxAttr + '>' + icon('i-camera','s26') +

      list.map(p => '<button ' + thumbAttr(p).replace('__C__', 'pthumb') + ' data-a="viewphoto" data-id="' + p.id + '">' +

function seedPhotos(st) {
  st.photos = [];
  const done = st.tasks.filter(t => t.status === 'done');
  done.forEach((t, i) => {
    const n = (typeof hasDocs === 'function' && hasDocs(t)) ? 4 : 1 + (i % 3);
    for (let k = 0; k < n; k++) {
      const s = PHOTO_SEED[(i * 3 + k) % PHOTO_SEED.length];
      const withSub = k > 0 && t.subs.filter(x => x.done).length;
      const sub = withSub ? t.subs.filter(x => x.done)[k % t.subs.filter(x => x.done).length] : null;
      st.photos.push({
        id: uid('F'), src: 'IMG:' + s.img,
        title: sub ? sub.name : s.t,
        desc: sub ? ('توثيق تنفيذ «' + sub.name + '» ضمن ' + t.title + '.') : s.d,
        by: t.leaderId, at: (t.startedAt || t.start) + (k + 1) * 40 * MIN,
        taskId: t.id, subId: sub ? sub.id : null, ticketId: null
      });
    }
  });
  st.photos.sort((a, b) => b.at - a.at);
}

/* ---------- التقاط الصورة وضغطها قبل الحفظ ---------- */
function readShot(file, cb) {
  if (!file) return cb(null);
  const fr = new FileReader();
  fr.onerror = () => cb(null);
  fr.onload = () => {
    const im = new Image();
    im.onerror = () => cb(null);
    im.onload = () => {
      const sc = Math.min(1, MAX_PHOTO_W / (im.width || MAX_PHOTO_W));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(im.width * sc));
      c.height = Math.max(1, Math.round(im.height * sc));
      const g = c.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(im, 0, 0, c.width, c.height);
      try { cb(c.toDataURL('image/jpeg', PHOTO_Q)); } catch (e) { cb(null); }
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ============================ دليل المهام — تعليمات لكل نوع مهمة ============================ */
/* لكل نشاط دليل مستقل: خطوات نصية · صور متتابعة · فيديو قصير · ملف PDF
   يقرؤه الجميع، ويحرّره الليدر من الإعدادات */

const MAX_MEDIA = 1.6 * 1024 * 1024;    /* حد الملف المرفوع في النسخة المحلية */
const STEP_KIND = {
  text:  { l:'تعليمة مكتوبة', i:'i-text' },
  photo: { l:'صورة توضيحية',  i:'i-camera' },
  video: { l:'فيديو قصير',    i:'i-video' },
  pdf:   { l:'ملف PDF',       i:'i-file' }
};

const seededMedia = s => String(s.src).indexOf('IMG:') === 0;
const mediaKey = s => String(s.src).slice(4).replace(/_w$/, '');
const mediaSrc = s => s.src;
const guideOf = kind => (S.guides && S.guides[kind]) || null;
const guideSteps = kind => { const g = guideOf(kind); return g ? g.steps : []; };
const hasGuide = t => guideSteps(t.kind).length > 0;
const canEditGuide = () => isLeader();

function ensureGuide(kind) {
  S.guides = S.guides || {};
  if (!S.guides[kind]) S.guides[kind] = { steps: [], at: now(), by: S.session.id };
  return S.guides[kind];
}
function addStep(kind, step) {
  const g = ensureGuide(kind);
  g.steps.push(Object.assign({ id: uid('G'), at: now(), by: S.session.id }, step));
  g.at = now(); g.by = S.session.id;
}
function moveStep(kind, id, dir) {
  const g = ensureGuide(kind), i = g.steps.findIndex(s => s.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= g.steps.length) return;
  const tmp = g.steps[i]; g.steps[i] = g.steps[j]; g.steps[j] = tmp;
  g.at = now();
}
function delStep(kind, id) {
  const g = ensureGuide(kind);
  g.steps = g.steps.filter(s => s.id !== id);
  g.at = now();
}

/* ---------- زر «للمهمة دليل» — داخل المهمة وخارجها ---------- */
function guideChip(t, big) {
  const n = guideSteps(t.kind).length;
  if (!n) return '';
  return '<button class="gchip' + (big ? ' big' : '') + '" data-a="go" data-n="guide" data-id="' + t.kind + '">' +
    icon('i-guide', big ? 's18' : 's14') +
    '<span>' + (big ? 'دليل تنفيذ المهمة · ' + AR(n) + ' خطوة' : 'دليل') + '</span>' +
    (big ? icon('i-back','s16') : '') + '</button>';
}

/* ---------- عرض خطوة ---------- */
function stepCard(s, i, editing, kind) {
  const head = '<div class="row" style="margin-bottom:8px">' +
    '<span class="fl" style="gap:7px"><span class="gnum">' + AR(i + 1) + '</span>' +
    '<b class="sm">' + E(s.title || STEP_KIND[s.kind].l) + '</b></span>' +
    (editing ? '<span class="fl" style="gap:4px">' +
      '<button class="gbtn" data-a="stepup" data-k="' + kind + '" data-id="' + s.id + '" aria-label="أعلى">' + icon('i-down','s14') + '</button>' +
      '<button class="gbtn dn" data-a="stepdn" data-k="' + kind + '" data-id="' + s.id + '" aria-label="أسفل">' + icon('i-down','s14') + '</button>' +
      '<button class="gbtn del" data-a="stepdel" data-k="' + kind + '" data-id="' + s.id + '" aria-label="حذف">' + icon('i-x','s14') + '</button>' +
      '</span>' : pill(STEP_KIND[s.kind].l, 'gold')) + '</div>';

  let body = '';
  if (s.kind === 'text') body = '<div class="sm" style="line-height:2">' + E(s.body) + '</div>';
  else if (s.kind === 'photo') body =
    (seededMedia(s) ? '<div class="gimg bgw-' + mediaKey(s) + '" role="img"></div>'
      : '<img class="gimg" src="' + mediaSrc(s) + '" alt="' + E(s.title || '') + '">') +
    (s.body ? '<div class="tiny dim" style="margin-top:8px">' + E(s.body) + '</div>' : '');
  else if (s.kind === 'video') body =
    '<video class="gimg" src="' + mediaSrc(s) + '" controls playsinline preload="metadata"></video>' +
    (s.body ? '<div class="tiny dim" style="margin-top:8px">' + E(s.body) + '</div>' : '');
  else if (s.kind === 'pdf') body =
    '<a class="docbtn" href="' + mediaSrc(s) + '" target="_blank" rel="noopener" download="' + E(s.file || 'guide.pdf') + '">' +
      '<span class="fi"><b>PDF</b></span>' +
      '<span class="sp"><b>' + E(s.file || 'ملف الدليل') + '</b><span>' + E(s.size || '') + '</span></span>' +
      '<span class="eye">' + icon('i-eye','s16') + '</span></a>' +
    (s.body ? '<div class="tiny dim" style="margin-top:8px">' + E(s.body) + '</div>' : '');

  return '<div class="c gstep">' + head + body + '</div>';
}

        '<button class="btn l sm" data-a="addstep" data-k="' + kind + '" data-v="pdf">' + icon('i-file','s16') + 'ملف PDF</button>' +
      '</div>' : '') +

    '<div class="lbl">خطوات التنفيذ<small>' + AR(steps.length) + ' خطوة</small></div>' +

/* ---------- قراءة ملف الوسائط ---------- */
function readMedia(file, mk, cb) {
  if (!file) return cb(null);
  if (mk === 'photo') return readShot(file, cb);
  if (file.size > MAX_MEDIA) return cb('TOOBIG');
  const fr = new FileReader();
  fr.onerror = () => cb(null);
  fr.onload = () => cb(fr.result);
  fr.readAsDataURL(file);
}
const fileSize = n => n > 1048576 ? AR((n / 1048576).toFixed(1)) + ' م.ب' : AR(Math.round(n / 1024)) + ' ك.ب';

/* ============================ التحضير اليومي والشِفتات ============================ */
/* حضور يومي داخل المقر · شِفت لكل موظف · طلب تبديل شِفت يمرّ بالليدر ثم الكنترول */

const SHIFTS = {
  am:   { l:'صباحي',  from:6,  to:14, i:'i-sun',   c:'#B8791A' },
  pm:   { l:'مسائي',  from:14, to:22, i:'i-clock', c:'#1B6E9C' },
  night:{ l:'ليلي',   from:22, to:6,  i:'i-hour',  c:'#4A3F7A' }
};
const HQ = 'مقر البعثة — العزيزية';
const DAY_AB = ['أحد','اثن','ثلا','أرب','خمي','جمع','سبت'];
const SWAP_STATE = {
  pending:  ['بانتظار الليدر', 'wait'],
  escalated:['مرفوعة للكنترول', 'blue'],
  approved: ['معتمدة', 'live'],
  rejected: ['مرفوضة', 'no']
};

const shiftOf = id => (S.shifts && S.shifts[id]) || 'am';
const shiftInfo = id => SHIFTS[shiftOf(id)];
const inHQ = () => S.myPlace === 'hq';

/* سجل حضور يوم بعينه */
const dayRec = (id, ts) => (S.attend || []).find(a => a.userId === id && a.day === dayStart(ts));
const attendedToday = id => !!dayRec(id, now());

function canCheckIn(id) {
  if (dayRec(id, now())) return false;
  return inHQ();
}
function checkInReason() {
  if (attendedToday(S.session.id)) return 'حضّرت اليوم بالفعل';
  if (!inHQ()) return 'التحضير اليومي من داخل المقر فقط — بدّل موقعك إلى «داخل المقر»';
  return '';
}
function checkIn(id) {
  if (!canCheckIn(id)) return false;
  const sh = shiftOf(id), s = SHIFTS[sh];
  const d = new Date(now());
  const late = d.getHours() > s.from || (d.getHours() === s.from && d.getMinutes() > 15);
  S.attend.unshift({ id: uid('A'), userId: id, day: dayStart(now()), at: now(), shift: sh, late });
  const u = userById(id);
  if (u.role === 'muhsen' && u.leaderId) notify(u.leaderId, 'i-check', 'تحضير يومي',
    u.name + ' حضّر ' + t12(now()) + (late ? ' — متأخرًا' : ''), { n: 'daily' });
  return true;
}

/* ---------- التزام الأسابيع الماضية ---------- */
function weekStats(id, weeksAgo) {
  const end = dayStart(now()) - weeksAgo * 7 * DAY;
  let done = 0, late = 0, days = 0;
  for (let i = 0; i < 7; i++) {
    const d = end - i * DAY;
    if (d > dayStart(now())) continue;
    days++;
    const r = dayRec(id, d);
    if (r) { done++; if (r.late) late++; }
  }
  return { days, done, late, pct: days ? Math.round(done / days * 100) : 0 };
}

/* ---------- طلبات تبديل الشِفت ---------- */
function pendingSwaps() {
  const u = me(); if (!u) return [];
  if (u.role === 'leader') return (S.swaps || []).filter(s => s.leaderId === u.id && s.state === 'pending');
  return (S.swaps || []).filter(s => s.from === u.id && s.state === 'pending');
}
const mySwaps = () => {
  const u = me(); if (!u) return [];
  return (S.swaps || []).filter(s => s.from === u.id || s.leaderId === u.id)
    .sort((a, b) => b.at - a.at);
};
function addSwap(fromId, toShift, day, reason) {
  const u = userById(fromId);
  const s = {
    id: uid('W'), no: 'SW-' + AR(3100 + (S.swaps || []).length),
    from: fromId, leaderId: u.role === 'muhsen' ? u.leaderId : null,
    fromShift: shiftOf(fromId), toShift, day, reason,
    state: u.role === 'muhsen' ? 'pending' : 'escalated', at: now(),
    log: [{ at: now(), by: fromId, text: 'قدّم ' + u.name + ' طلب تبديل الشِفت' }]
  };
  S.swaps.unshift(s);
  if (s.leaderId) notify(s.leaderId, 'i-swap', 'طلب تبديل شِفت',
    u.name + ' يطلب التحويل إلى الشِفت ' + SHIFTS[toShift].l + ' — ' + reason, { n: 'daily' });
  else s.log.push({ at: now(), by: fromId, text: 'رُفع الطلب إلى الكنترول مباشرة' });
  return s;
}
function swapAct(s, act, note_) {
  const by = me();
  if (act === 'approve') {
    s.state = 'approved'; s.at2 = now();
    S.shifts[s.from] = s.toShift;
    s.log.push({ at: now(), by: by.id, text: 'اعتمد ' + by.name + ' التبديل — صار الشِفت ' + SHIFTS[s.toShift].l });
    notify(s.from, 'i-checkc', 'اعتُمد تبديل الشِفت',
      'شِفتك الجديد: ' + SHIFTS[s.toShift].l + ' · ' + shiftWindow(s.toShift), { n: 'daily' });
  } else if (act === 'reject') {
    s.state = 'rejected'; s.at2 = now(); s.note = note_;
    s.log.push({ at: now(), by: by.id, text: 'رفض ' + by.name + ' الطلب — ' + note_ });
    notify(s.from, 'i-xc', 'رُفض تبديل الشِفت', note_, { n: 'daily' });
  } else if (act === 'escalate') {
    s.state = 'escalated'; s.at2 = now(); s.note = note_ || '';
    s.log.push({ at: now(), by: by.id, text: 'رفع ' + by.name + ' الطلب إلى الكنترول' +
      (note_ ? ' — ' + note_ : '') });
    notify(s.from, 'i-send', 'رُفع طلبك للكنترول',
      'رفع الليدر طلب تبديل الشِفت إلى غرفة العمليات.', { n: 'daily' });
  }
}

/* ---------- بذر ثلاثة أسابيع ماضية وأسبوع جارٍ ---------- */
function seedDaily(st) {
  st.shifts = {}; st.attend = []; st.swaps = [];
  const keys = Object.keys(SHIFTS);
  st.users.forEach((u, i) => { st.shifts[u.id] = keys[i % keys.length]; });

  const today = (function () { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); })();
  st.users.forEach((u, ui) => {
    for (let d = 27; d >= 0; d--) {          /* أربعة أسابيع: ٣ ماضية + الجاري */
      const day = today - d * DAY;
      /* غياب نادر ومتفرّق حتى تبدو البيانات حقيقية */
      const skip = ((ui * 7 + d) % 23) === 0;
      if (skip) continue;
      const s = SHIFTS[st.shifts[u.id]];
      const late = ((ui * 5 + d) % 9) === 0;
      st.attend.push({
        id: uid('A'), userId: u.id, day,
        at: day + s.from * HR + (late ? 34 : 6) * MIN,
        shift: st.shifts[u.id], late
      });
    }
  });
  st.attend.sort((a, b) => b.at - a.at);

  /* طلبان قائمان ليُجرَّب المسار */
  const L1 = st.users.find(u => u.role === 'leader');
  const team = st.users.filter(u => u.role === 'muhsen' && u.leaderId === L1.id);
  if (team[0]) st.swaps.push({
    id: uid('W'), no: 'SW-' + AR(3100), from: team[0].id, leaderId: L1.id,
    fromShift: st.shifts[team[0].id], toShift: keys.find(k => k !== st.shifts[team[0].id]),
    day: today + 2 * DAY, reason: 'موعد طبي في المستشفى صباح ذلك اليوم.',
    state: 'pending', at: Date.now() - 4 * HR,
    log: [{ at: Date.now() - 4 * HR, by: team[0].id, text: 'قدّم ' + team[0].name + ' طلب تبديل الشِفت' }]
  });
  if (team[1]) st.swaps.push({
    id: uid('W'), no: 'SW-' + AR(3101), from: team[1].id, leaderId: L1.id,
    fromShift: st.shifts[team[1].id], toShift: keys.find(k => k !== st.shifts[team[1].id]),
    day: today - DAY, reason: 'تعارض مع مهمة استقبال في المطار.',
    state: 'escalated', at: Date.now() - 2 * DAY, note: 'يحتاج موافقة الكنترول لتعارضه مع جدول الفوج.',
    log: [
      { at: Date.now() - 2 * DAY, by: team[1].id, text: 'قدّم ' + team[1].name + ' طلب تبديل الشِفت' },
      { at: Date.now() - 2 * DAY + 3 * HR, by: L1.id, text: 'رفع ' + L1.name + ' الطلب إلى الكنترول' }
    ]
  });
}

/* ============================ الإشعارات الخارجية ============================ */
/* إشعار نظام حقيقي على الجوال عبر عامل الخدمة — يظهر خارج التطبيق ما دام مثبَّتًا.
   بلا خادم لا يمكن إيصاله لجهاز آخر، فما يصل الفئة المستهدفة يُسجَّل داخل التطبيق
   ويظهر لها إشعارًا خارجيًّا عند فتحها التطبيق على أجهزتها. */

const pushSupported = () => typeof Notification !== 'undefined' && 'serviceWorker' in navigator;
const pushState = () => (typeof Notification === 'undefined' ? 'unsupported' : Notification.permission);
const pushOn = () => pushState() === 'granted' && S.pushEnabled !== false;

const AUDIENCE = {
  all:      { l:'الجميع',     d:'كل الليدرز والمحسنين' },
  leaders:  { l:'الليدرز',    d:'قادة الفرق فقط' },
  muhsens:  { l:'المحسنون',   d:'كل المحسنين' },
  myteam:   { l:'فريقي',      d:'محسنو فريقك أنت' }
};
function audienceUsers(k) {
  const u = me();
  if (k === 'leaders') return S.users.filter(x => x.role === 'leader');
  if (k === 'muhsens') return S.users.filter(x => x.role === 'muhsen');
  if (k === 'myteam') return teamOf(u.id);
  return S.users.slice();
}

function askPush() {
  if (!pushSupported()) { toast('جهازك لا يدعم الإشعارات الخارجية', 'r'); return; }
  Notification.requestPermission().then(p => {
    S.pushEnabled = p === 'granted';
    if (p === 'granted') {
      const n = deliverBacklog(true);
      toast(n ? 'فُعِّلت التنبيهات — وصلك ' + AR(n) + ' إشعارًا قائمًا' : 'فُعِّلت التنبيهات الخارجية', 'g');
    } else {
      toast(p === 'denied' ? 'رُفض الإذن — فعّله من إعدادات المتصفح' : 'لم يُمنح الإذن', 'r');
    }
    render();
  }).catch(() => { toast('تعذّر طلب الإذن', 'r'); render(); });
}

/* إطلاق إشعار نظام فعلي */
function firePush(title, body, tag) {
  if (!pushOn()) return false;
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.ready) {
      navigator.serviceWorker.ready.then(reg => {
        reg.showNotification(title, {
          body: body, tag: tag || 'muhsen', dir: 'rtl', lang: 'ar',
          icon: 'icon-192.png', badge: 'icon-192.png', renotify: true
        });
      }).catch(() => { try { new Notification(title, { body: body, dir: 'rtl' }); } catch (e) {} });
    } else { new Notification(title, { body: body, dir: 'rtl' }); }
    return true;
  } catch (e) { return false; }
}

/* كل إشعار داخلي يصل المستخدم الحالي يخرج إلى نظام الجهاز أيضًا */
function pushBridge(toId, title, body, nid) {

/* ---------- المتراكم: ما لم يصل سابقًا وما زالت حالته قائمة ---------- */
/* إشعار «قائم» = لم يُقرأ، ومرجعه ما زال يستدعي إجراءً:
   مهمة لم تُغلق · تذكرة مفتوحة · طلب معلّق · أو إشعار عام بلا مرجع */
function stillRelevant(n) {
  if (n.read) return false;
  const r = n.route || {};
  if (r.n === 'task' || r.n === 'assign' || r.n === 'timeline') {
    const t = taskById(r.id);
    if (!t) return false;
    return ['done', 'cancelled'].indexOf(t.status) < 0;
  }
  if (r.n === 'ticket') {
    const k = S.tickets.find(x => x.id === r.id);
    return !!k && k.status !== 'مغلقة';
  }
  if (r.n === 'photo') return (S.photos || []).some(x => x.id === r.id);
  return true;
}

const BACKLOG_MAX = 6;   /* أكثر من ذلك يُجمَع في إشعار واحد */

function deliverBacklog(force) {
  if (!pushOn() || !S.session) return 0;
  const list = S.notifs
    .filter(n => n.to === S.session.id && (force || !n.pushed) && stillRelevant(n))
    .sort((a, b) => a.at - b.at);
  if (!list.length) return 0;

  const head = list.slice(0, BACKLOG_MAX), rest = list.length - head.length;
  head.forEach((n, i) => {
    setTimeout(function () { firePush(n.title, n.body, 'n-' + n.id); }, i * 420);
  });
  if (rest > 0) setTimeout(function () {
    firePush('و' + AR(rest) + ' إشعارات أخرى تنتظرك',
      'افتح تطبيق مُحسن لمراجعتها كلها.', 'n-more');
  }, head.length * 420);
  list.forEach(n => { n.pushed = true; });
  return list.length;
}

  firePush(title, body + ' · إلى ' + AUDIENCE[aud].l, 'bc');

  lreq: screenReqCenter, requests: screenRequests,

  const fn = SCREENS[n] || (isLeader() ? screenLeaderHome : screenMuhsenHome);
  const el = document.getElementById('screen');
  el.className = n === 'admin' ? 'adm' : '';

  let pushHTML = '';
  const fresh = S.session ? S.notifs.filter(x => x.to === S.session.id && !x.read) : [];
  if (fresh.length && fresh[0].id !== S._seen) { S._seen = fresh[0].id; S.push = fresh[0].id; }
  if (S.push && S.session) {
    const p = S.notifs.find(x => x.id === S.push);
    if (!p || p.read) S.push = null;
    else {
      const nk = nkind(p);
      const kind = nk.k === 'bad' ? 'bad' : nk.k === 'ask' ? 'warn' : '';

    '<span class="sp">' + E(S.toast.text) + '</span></div>';

/* ===== الشريط: الكتلة تتبدّل صفحةً واحدة ===== */
function centerActiveTab() {}

function goTabPage(next) {
  const nav = document.querySelector('.tabs'); if (!nav) return;
  const pages = Number(nav.dataset.pages || 1);
  const cur = Math.min(Math.max(S.tabPage || 0, 0), pages - 1);
  const to = Math.min(Math.max(next, 0), pages - 1);
  if (to === cur) return;
  S.tabPage = to; S._tabAuto = null;
  nav.querySelectorAll('.trail').forEach(t => { t.style.transform = 'translateX(' + (to * 100) + '%)'; });
  nav.querySelectorAll('.dots button').forEach((d, i) => {
    if (i === to) d.classList.add('on'); else d.classList.remove('on');
  });
  try { navigator.vibrate && navigator.vibrate(8); } catch (e) {}
  save();
}

(function tabSwipe() {
  let st = null;
  const grab = t => {
    const nav = t && t.closest ? t.closest('.tabs') : null;
    if (!nav || t.closest('.home') || t.closest('.dots')) return null;
    return nav;
  };
  function move(x) {
    if (!st) return false;
    const dx = x - st.x;
    if (Math.abs(dx) < 40) return false;
    st.moved = true;
    goTabPage((S.tabPage || 0) + (dx > 0 ? 1 : -1));   /* الكتلة تتبع الإصبع */
    const nav = st.nav; st = null;
    nav.dataset.dragged = '1';
    setTimeout(() => { delete nav.dataset.dragged; }, 220);
    return true;
  }
  document.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const nav = grab(e.target); if (!nav) return;
    st = { nav, x: e.clientX, moved: false };
  });
  document.addEventListener('pointermove', e => { if (st) move(e.clientX); });
  document.addEventListener('pointerup', () => { st = null; });
  document.addEventListener('pointercancel', () => { st = null; });
  document.addEventListener('touchstart', e => {
    const nav = grab(e.target); if (!nav) return;
    st = { nav, x: e.touches[0].clientX, moved: false };
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!st) return;
    if (move(e.touches[0].clientX) && e.cancelable) e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchend', () => { st = null; });
  let wl = 0;
  document.addEventListener('wheel', e => {
    const nav = e.target.closest && e.target.closest('.tabs'); if (!nav) return;
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (!d) return;
    if (e.cancelable) e.preventDefault();
    const t = Date.now(); if (t - wl < 320) return; wl = t;
    goTabPage((S.tabPage || 0) + (d > 0 ? -1 : 1));
  }, { passive: false });
  document.addEventListener('keydown', e => {
    if (!document.querySelector('.tabs')) return;
    if (e.key === 'ArrowLeft') goTabPage((S.tabPage || 0) - 1);
    else if (e.key === 'ArrowRight') goTabPage((S.tabPage || 0) + 1);
  });
})();

/* ===== ملاءمة الشاشة ===== */
(function fitScreen() {
  const root = document.documentElement;
  const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
    window.navigator.standalone === true;
  root.classList.add(standalone ? 'app-standalone' : 'app-browser');
  function fit() { root.style.setProperty('--appH', window.innerHeight + 'px'); }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 220); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
})();

  if (!S || !S.session) return;

  document.querySelectorAll('.timer[data-deadline]').forEach(el => {

    if (now() >= target) due = true;
    const r = hms(Math.abs(target - now()));

    if (b.length === 3) { b[0].textContent = AR(r.h); b[1].textContent = AR(r.m); b[2].textContent = AR(r.s); }

}, 1000);

      if (!(isLeader() && p.by === S.session.id)) { toast('الحذف لمن التقط الصورة فقط', 'r'); break; }
      const back = p.taskId;
      deletePhoto(id); toast('حُذفت الصورة', 'r');
      S.route = back ? { n: 'task', id: back } : { n: 'album' }; break; }
    case 'picksub': { const t = T(); if (!t) break;
      if (!canShoot()) { toast('التصوير من صلاحية الليدر', 'r'); break; }
      S.sheet = subPickSheet(t); break; }
    /* ===== تصنيف المهام ===== */
    case 'bucketmenu': S.sheet = bucketSheet(); break;

    /* ===== التحضير اليومي ===== */
    case 'checkin': {
      if (!canCheckIn(S.session.id)) { toast(checkInReason(), 'r'); break; }
      checkIn(S.session.id); buzz(); toast('سُجّل تحضيرك ' + t12(now())); break; }
    case 'swapreq': S.swapTo = null; S.sheet = swapSheet(); break;
    case 'swapto': S.swapTo = v; S.sheet = swapSheet(); break;
    case 'dosendswap': {
      const to = S.swapTo || Object.keys(SHIFTS).find(k => k !== shiftOf(S.session.id));
      const rsn = val('swr'), dy = val('swd');
      if (!rsn || rsn.length < 6) { toast('اذكر سببًا واضحًا للتبديل', 'r'); break; }
      if (!dy) { toast('اختر اليوم المطلوب', 'r'); break; }
      const dts = new Date(dy + 'T00:00:00').getTime();
      if (isNaN(dts)) { toast('تاريخ غير صالح', 'r'); break; }
      if (to === shiftOf(S.session.id)) { toast('اختر شِفتًا مختلفًا', 'r'); break; }
      if ((S.swaps || []).some(x => x.from === S.session.id && x.state === 'pending'))
        { toast('لديك طلب قائم بانتظار الرد', 'r'); break; }
      addSwap(S.session.id, to, dts, rsn);
      S.sheet = null; S.tab.dl = 'swap'; buzz(); toast('أُرسل الطلب إلى ليدرك'); break; }
    case 'swapok': { const s = S.swaps.find(x => x.id === id);
      if (!s || s.leaderId !== S.session.id) { toast('ليست من صلاحيتك', 'r'); break; }
      swapAct(s, 'approve'); buzz(); toast('اعتُمد التبديل'); break; }
    case 'swapno': { const s = S.swaps.find(x => x.id === id);
      if (!s || s.leaderId !== S.session.id) { toast('ليست من صلاحيتك', 'r'); break; }
      S.sheet = textSheet('رفض طلب التبديل', 'السبب إلزامي ويصل مقدّم الطلب',
        'data-a="doswapno" data-id="' + id + '"', '', 'سبب الرفض'); break; }
    case 'doswapno': { const s = S.swaps.find(x => x.id === id), rr = val('txt');
      if (!rr) { toast('السبب إلزامي', 'r'); break; }
      swapAct(s, 'reject', rr); S.sheet = null; toast('رُفض الطلب', 'r'); break; }
    case 'swapesc': { const s = S.swaps.find(x => x.id === id);
      if (!s || s.leaderId !== S.session.id) { toast('ليست من صلاحيتك', 'r'); break; }
      S.sheet = textSheet('رفع الطلب للكنترول', 'يصل غرفة العمليات مع ملاحظتك',
        'data-a="doswapesc" data-id="' + id + '"', '', 'ملاحظة للكنترول (اختياري)'); break; }
    case 'doswapesc': { const s = S.swaps.find(x => x.id === id);
      swapAct(s, 'escalate', val('txt')); S.sheet = null; toast('رُفع الطلب للكنترول'); break; }

    /* ===== الإشعارات الخارجية ===== */
    case 'pushask': S.sheet = null; askPush(); return;
    case 'pushlater': S.sheet = null; toast('يمكنك تفعيلها لاحقًا من شاشة التحكم'); break;
    case 'pushtoggle': S.pushEnabled = !pushOn();
      toast(S.pushEnabled ? 'شُغّلت الإشعارات الخارجية' : 'أُوقفت الإشعارات الخارجية'); break;
    case 'pushbacklog': {
      if (!pushOn()) { toast('فعّل الإذن أولًا', 'r'); break; }
      const n4 = deliverBacklog(true);
      toast(n4 ? 'أُرسل ' + AR(n4) + ' إشعارًا' : 'لا يوجد ما ينتظر إجراءً'); break; }
    case 'pushtest': {
      if (!pushOn()) { toast('فعّل الإذن أولًا', 'r'); break; }
      firePush('تطبيق مُحسن', 'هذا إشعار تجريبي — وصلك بنجاح.', 'test');
      toast('أُرسل إشعار تجريبي'); break; }
    case 'bcaud': S.bcAud = v; break;
    case 'dobroadcast': {
      const ti = val('bct'), bo = val('bcb');
      if (ti.length < 4) { toast('اكتب عنوانًا واضحًا', 'r'); break; }
      if (bo.length < 6) { toast('اكتب نص الإشعار', 'r'); break; }
      const n3 = broadcast(S.bcAud || 'muhsens', ti, bo);
      buzz(); toast('أُرسل إلى ' + AR(n3) + ' شخصًا'); break; }

    /* ===== دليل المهام ===== */
    case 'guidedit': {
      if (!canEditGuide()) { toast('التحرير من صلاحية الليدر', 'r'); break; }
      S.guideEdit = !S.guideEdit;
      toast(S.guideEdit ? 'وضع التحرير مفتوح' : 'أُغلق وضع التحرير'); break; }
    case 'addstep': {
      if (!canEditGuide()) { toast('التحرير من صلاحية الليدر', 'r'); break; }
      const k = b.dataset.k, mk = v;
      S.pendingMedia = null; S.pendingMediaName = null; S.pendingMediaSize = null;
      S.sheet = mk === 'text' ? stepTextSheet(k) : stepMediaSheet(k, mk); break; }
    case 'pickmedia': {
      S.mediaCtx = { kind: b.dataset.k, mk: v };
      S.sheetDraft = val('gt'); S.sheetDraft2 = val('gb');
      const el2 = document.getElementById(v === 'pdf' ? 'pdf' : v === 'video' ? 'vid' : 'cam');
      if (!el2) { toast('غير متاح على هذا الجهاز', 'r'); break; }
      el2.value = ''; el2.click(); return; }
    case 'cancelstep': S.pendingMedia = null; S.mediaCtx = null; S.sheet = null; break;
    case 'savestep': {
      if (!canEditGuide()) { toast('التحرير من صلاحية الليدر', 'r'); break; }
      const k = b.dataset.k, mk = v, ti = val('gt'), bo = val('gb');
      if (ti.length < 3) { toast('اكتب عنوانًا واضحًا للخطوة', 'r'); break; }
      if (mk === 'text' && bo.length < 10) { toast('نص التعليمة قصير — اشرحها بوضوح', 'r'); break; }
      if (mk !== 'text' && !S.pendingMedia) { toast('اختر الملف أولًا', 'r'); break; }
      addStep(k, { kind: mk, title: ti, body: bo, src: S.pendingMedia || null,
        file: S.pendingMediaName || null, size: S.pendingMediaSize || null });
      S.pendingMedia = null; S.pendingMediaName = null; S.pendingMediaSize = null; S.mediaCtx = null;
      S.sheet = null; buzz(); toast('أُضيفت الخطوة إلى الدليل'); break; }
    case 'stepup': moveStep(b.dataset.k, id, -1); break;
    case 'stepdn': moveStep(b.dataset.k, id, 1); break;
    case 'stepdel': {
      if (!canEditGuide()) { toast('الحذف من صلاحية الليدر', 'r'); break; }
      delStep(b.dataset.k, id); toast('حُذفت الخطوة', 'r'); break; }

    case 'appupdate': {
      toast('جارٍ التحديث…');
      try {
        if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
        if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations()
          .then(function (rs) { rs.forEach(function (x) { x.unregister(); }); });
      } catch (e) {}
      setTimeout(function () { location.reload(true); }, 700);
      return; }
    case 'printdoc': try { window.print(); } catch (e) { toast('الطباعة غير متاحة', 'r'); } return;

    case 'askreset': S.sheet = confirmSheet('إعادة ضبط كل شيء',
      'ستُحذف كل التسكينات والردود والتنبيهات والتذاكر والتقييمات.', 'data-a="doreset"', true); break;
    case 'doreset': S.sheet = null; reset(); return;
  }
  render();
});

/* بحث الحجاج */
document.addEventListener('input', ev => {
  if (ev.target && ev.target.id === 'pq') {
    const v = ev.target.value;
    S.tab.pq = v;
    render();
    const el = document.getElementById('pq');
    if (el) { el.focus(); try { el.setSelectionRange(v.length, v.length); } catch (e) {} }
  }
});

/* لوحة المفاتيح: العناصر ذات role=button تعمل بالمسافة والإدخال */
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter' && ev.key !== ' ') return;
  const b = ev.target && ev.target.closest ? ev.target.closest('[role="button"][data-a]') : null;
  if (!b) return;
  ev.preventDefault(); b.click();
});

/* ============================ الكاميرا ============================ */
document.addEventListener('change', ev => {
  const id2 = ev.target && ev.target.id;
  if (id2 === 'vid' || id2 === 'pdf') return onGuideMedia(ev, id2 === 'vid' ? 'video' : 'pdf');
  if (id2 === 'cam' && S.mediaCtx) return onGuideMedia(ev, 'photo');
  if (id2 !== 'cam') return;
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  if (file.size > 12 * 1024 * 1024) { toast('الصورة كبيرة جدًّا', 'r'); render(); return; }
  toast('جارٍ معالجة الصورة…');
  render();
  readShot(file, src => {
    if (!src) { toast('تعذّرت قراءة الصورة', 'r'); render(); return; }
    S.toast = null;
    if (S.camCtx && S.camCtx.mode === 'excuse') {
      S.pendingExcuse = src;
      const sh = reopenReason();
      if (sh) S.sheet = sh;
    } else {
      S.pendingPhoto = src;
      S.sheet = photoMetaSheet();
    }
    render();
    const d = S.sheetDraft; S.sheetDraft = null;
    if (d) { const el = document.getElementById('txt'); if (el) el.value = d; }
  });
});

/* وسائط الدليل: صورة أو فيديو أو PDF */
function onGuideMedia(ev, mk) {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  const ctx = S.mediaCtx;
  if (!file || !ctx) return;
  const nm = file.name, sz = fileSize(file.size);
  toast('جارٍ تجهيز الملف…'); render();
  readMedia(file, mk, src => {
    if (src === 'TOOBIG') { S.toast = null; toast('الملف أكبر من ١٫٦ ميغابايت', 'r'); render(); return; }
    if (!src) { S.toast = null; toast('تعذّرت قراءة الملف', 'r'); render(); return; }
    S.toast = null;
    S.pendingMedia = src; S.pendingMediaName = nm; S.pendingMediaSize = sz;
    S.sheet = stepMediaSheet(ctx.kind, ctx.mk);
    render();
    const a1 = document.getElementById('gt'), a2 = document.getElementById('gb');
    if (a1 && S.sheetDraft) a1.value = S.sheetDraft;
    if (a2 && S.sheetDraft2) a2.value = S.sheetDraft2;
    S.sheetDraft = null; S.sheetDraft2 = null;
  });
}

/* ============================ إقلاع ============================ */
load();
if (typeof flushPending === 'function') setTimeout(flushPending, 900);
setTimeout(function () { if (typeof maybeAskPush === 'function' && maybeAskPush()) render(); }, 1800);
if (!S.session) S.route = { n: 'login' };
render();

</script>
