<title>تطبيق مُحسن</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap">

<style>
  :root{
    --g:#14593F; --g2:#0C3A29; --g3:#1D7452; --live:#0B8A4B;
    --gold:#A8875A; --gold2:#C6A86F;
    --ink:#101914; --dim:#6E7E75; --dim2:#8B978F;
    --bg:#FCFBF8; --amber:#B8791A; --red:#C0392B;
    --card:0 1px 2px rgba(11,53,39,.05), 0 4px 10px -4px rgba(11,53,39,.07), 0 18px 34px -22px rgba(11,53,39,.3);
    --f:"Almarai","SF Arabic","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%}
  body{direction:rtl; font-family:var(--f); background:#E8ECE8; color:var(--ink);
    font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; padding:20px}
  button{font:inherit; color:inherit; border:0; background:none; cursor:pointer; text-align:right}
  :focus-visible{outline:2px solid var(--g); outline-offset:2px; border-radius:8px}

  /* ---------- device ---------- */
  #device{width:414px; height:868px; max-height:calc(100vh - 40px); background:#131C18;
    border-radius:52px; padding:11px; box-shadow:0 2px 8px rgba(11,53,39,.22), 0 44px 72px -32px rgba(11,53,39,.6); flex:none}
  #screen{height:100%; background:var(--bg); border-radius:42px; overflow:hidden;
    position:relative; display:flex; flex-direction:column}
  @media (max-width:520px){
    body{padding:0; align-items:stretch}
    #device{width:100%; height:100%; max-height:none; border-radius:0; padding:0}
    #screen{border-radius:0}
  }

  /* الخلفية خلف كل شيء: z-index سالب وبلا لون معتم — وإلا حجبت العناصر الساكنة */
  .ground{position:absolute; inset:0; z-index:-1; overflow:hidden; pointer-events:none}
  .ground img{position:absolute; inset-inline-start:0; top:16%; width:100%; max-width:100%; opacity:.05}
  /* كل عنصر في الصفحة يُرسم فوق الخلفية */
  .view > *{position:relative; z-index:1}

  /* تمييز المهام المتأخرة في التسكين */
  .c.urgent{box-shadow:inset 0 0 0 1.5px rgba(192,57,43,.45), var(--card)}
  .c.urgent::before{content:""; position:absolute; top:0; left:20px; right:20px; height:2px;
    border-radius:2px; background:linear-gradient(90deg,transparent,#C0392B,transparent)}
  .c.soon{box-shadow:inset 0 0 0 1.5px rgba(184,121,26,.45), var(--card)}
  .c.soon::before{content:""; position:absolute; top:0; left:20px; right:20px; height:2px;
    border-radius:2px; background:linear-gradient(90deg,transparent,#B8791A,transparent)}
  .strip{display:flex; align-items:center; gap:7px; font-size:11.5px; font-weight:700; margin-top:9px;
    padding:8px 10px; border-radius:11px}
  .strip.r{background:#FCEDEB; color:#93261C}
  .strip.a{background:#FCF5E7; color:#7A5512}

  /* ---------- top bar ---------- */
  .top{position:relative; z-index:3; padding-bottom:14px; border-radius:0 0 26px 26px;
    background:linear-gradient(158deg,#1A6B4C 0%,#12513A 55%,#0D3E2C 100%);
    box-shadow:0 10px 30px -14px rgba(11,53,39,.6); color:#fff; flex:none}
  .top::after{content:""; position:absolute; left:24px; right:24px; bottom:0; height:1px;
    background:linear-gradient(90deg,transparent,rgba(216,198,164,.5),transparent)}
  .sbar{display:flex; justify-content:space-between; align-items:center; padding:12px 24px 2px;
    font-size:14px; font-weight:700}
  .nav{display:flex; align-items:center; gap:10px; padding:6px 16px 2px; min-height:42px}
  .nav .t{flex:1; text-align:center; font-size:17px; font-weight:700}
  .nav button{width:30px; height:30px; display:grid; place-items:center; color:#fff}

  /* ---------- body ---------- */
  .view{position:relative; z-index:2; flex:1; min-height:0; overflow-y:auto; overflow-x:hidden;
    padding:14px 14px 24px; display:flex; flex-direction:column; gap:12px;
    -webkit-overflow-scrolling:touch; overscroll-behavior:contain}
  .view::-webkit-scrollbar{width:0}
  /* حاسم: منع انكماش العناصر داخل الحاويات العمودية المرنة */
  .view > *, .col > *, .sheet > *{flex:none}
  .banner,.map,.thumb,.kpi,.meta,.cta,.btn,.c,.prow,.note,.listitem,.field,.seg{flex:none}

  /* ---------- tabbar ---------- */
  .tabs{display:flex; gap:4px; align-items:flex-start; padding:10px 10px 14px; background:#fff;
    position:relative; z-index:3; flex:none;
    overflow-x:auto; overflow-y:hidden; overscroll-behavior-x:contain;
    scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch;
    touch-action:pan-x; cursor:grab; scrollbar-width:none;
    box-shadow:0 -1px 0 rgba(20,89,63,.07), 0 -16px 34px -26px rgba(11,53,39,.55);
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%)}
  .tabs::-webkit-scrollbar{display:none}
  .tabs.dragging{cursor:grabbing; scroll-behavior:auto; scroll-snap-type:none}
  .tabs.dragging button{pointer-events:none}
  .tabs button{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10.5px;
    color:#8C9B92; width:64px; flex:none; text-align:center; padding:3px 0 0; scroll-snap-align:center;
    border-radius:14px; -webkit-user-select:none; user-select:none}
  .tabs button.on{color:var(--g); font-weight:700}
  .tabs .wi{position:relative}
  .tabs .hb{width:42px; height:42px; border-radius:50%; color:#fff; display:grid; place-items:center;
    background:linear-gradient(150deg,var(--g3),var(--g2));
    box-shadow:0 0 0 1px rgba(198,168,111,.55), 0 6px 14px -5px rgba(11,53,39,.7)}
  .tabs button.home{color:var(--g); font-weight:700}
  .tabs{position:relative} .tabs .arrow.al{inset-inline-start:2px}
  .badge{position:absolute; top:-4px; left:-7px; background:#D0342C; color:#fff; font-size:9px;
    min-width:16px; height:16px; border-radius:99px; display:grid; place-items:center;
    font-weight:700; padding:0 4px; border:2px solid #fff; line-height:1}

  /* ---------- primitives ---------- */
  .ic{width:22px; height:22px; flex:none; fill:none; stroke:currentColor; stroke-width:1.7;
    stroke-linecap:round; stroke-linejoin:round; display:block}
  .ic.f{fill:currentColor; stroke:none}
  .ic.s26{width:26px;height:26px} .ic.s18{width:18px;height:18px;stroke-width:1.85}
  .ic.s16{width:16px;height:16px;stroke-width:1.9} .ic.s14{width:14px;height:14px;stroke-width:2}

  .c{position:relative; background:#fff; border-radius:18px; padding:14px; box-shadow:var(--card)}
  .c.gold::before{content:""; position:absolute; top:0; left:20px; right:20px; height:1.5px;
    border-radius:2px; background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
  .row{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .fl{display:flex; align-items:center; gap:10px}
  .col{display:flex; flex-direction:column; gap:10px}
  .sp{flex:1; min-width:0}
  .dim{color:var(--dim)} .dim2{color:var(--dim2)}
  .tiny{font-size:11.5px; line-height:1.6}
  .sm{font-size:12.5px}
  .b{font-weight:700}
  .center{text-align:center}
  .hide{display:none !important}
  .trunc{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  /* لا يُقص اسم المهمة ولا بيانات الكرت أبدًا */
  .c b, .c .sm, .prow .nm b{overflow-wrap:anywhere; word-break:break-word}
  .prow .nm b, .prow .nm span{white-space:normal; overflow:visible; text-overflow:clip}
  .nowrapfix{white-space:normal}

  .lbl{font-size:14.5px; font-weight:700; margin:4px 2px 0}
  .lbl::after{content:""; display:block; width:34px; height:2px; border-radius:2px; margin-top:6px;
    background:linear-gradient(90deg,var(--gold2),rgba(198,168,111,0))}
  .lbl small{display:block; font-size:11.5px; font-weight:400; color:var(--dim2); margin-top:5px}
  .lbl.plain::after{display:none}

  /* حاسم: هذه عناصر span — بلا display صريح تتصرّف كنص وتتشوّه خارج الحاويات المرنة */
  .av,.eav,.thumb,.ico{display:block}
  .pill,.box,.tick{display:inline-flex; align-items:center; justify-content:center; vertical-align:middle}
  .pill{font-size:11px; font-weight:700; padding:4px 11px; border-radius:99px; white-space:nowrap; line-height:1.5}
  .pill.live{background:#E4F2E9; color:#0B6540}
  .pill.wait{background:#FBF1DE; color:#7F5310}
  .pill.no{background:#FBE9E7; color:#93261C}
  .pill.grey{background:#EFF1ED; color:#5A6C63}
  .pill.gold{background:#F5EDDF; color:#6E5729; box-shadow:inset 0 0 0 1px rgba(198,168,111,.45)}
  .pill.blue{background:#E7EEF6; color:#2A4A73}

  .btn{display:flex; align-items:center; justify-content:center; gap:8px; border-radius:14px;
    padding:13px; font-weight:700; font-size:13.5px; width:100%}
  .btn.p{background:linear-gradient(150deg,var(--g3),var(--g2)); color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 12px 24px -14px rgba(11,53,39,.9)}
  .btn.g{background:#fff; color:var(--g); border:1.5px solid rgba(20,89,63,.35)}
  .btn.l{background:#fff; color:var(--g); box-shadow:inset 0 0 0 1px rgba(198,168,111,.5), var(--card)}
  .btn.d{background:#fff; color:var(--red); border:1.5px solid rgba(192,57,43,.3)}
  .btn.off{background:#EAEDE9; color:#93A099; cursor:not-allowed}
  .btn.sm{padding:10px; font-size:12.5px; border-radius:12px}
  .grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px}
  .grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px}
  .grid2 > *, .grid3 > *{min-width:0}
  .view > *{max-width:100%}
  .prow .nm{min-width:0}
  .prow .nm b,.prow .nm span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

  .cta{position:relative; display:flex; align-items:center; gap:13px; border-radius:17px;
    padding:14px 16px; color:#fff; background:linear-gradient(150deg,var(--g3) 0%,#12523A 55%,var(--g2) 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 14px 28px -14px rgba(11,53,39,.9); width:100%}
  .cta.off{background:#EAEDE9; color:#93A099; box-shadow:none; cursor:not-allowed}
  .cta .t{flex:1; text-align:center}
  .cta b{display:block; font-size:14.5px} .cta span{display:block; font-size:11px; opacity:.82}

  .av{width:46px; height:46px; border-radius:50%; flex:none; overflow:hidden;
    box-shadow:0 0 0 1.5px rgba(198,168,111,.55), 0 4px 12px -5px rgba(11,53,39,.45)}
  .av svg{width:100%; height:100%; display:block}
  .av.sm{width:36px;height:36px} .av.lg{width:58px;height:58px} .av.xl{width:78px;height:78px}
  .av.p1{--skin:#EDC59B;--beard:#382D22;--check:#BE4B40;--thobe:#6B6047;--avbg:#E9F1EB}
  .av.p2{--skin:#D9A87B;--beard:#4A3B2C;--check:transparent;--thobe:#77694D;--avbg:#EDF2EC}
  .av.p3{--skin:#C68B5E;--beard:#241D16;--check:#BE4B40;--thobe:#5F5641;--avbg:#E8EFE9}
  .av.p4{--skin:#F1CDA6;--beard:#7A6247;--check:transparent;--thobe:#6E6349;--avbg:#EFF3ED}
  .av.p5{--skin:#EDC59B;--hijab:#1E1A17;--abaya:#57452F;--avbg:#F0EAE1}
  .av.p6{--skin:#D9A87B;--hijab:#23322B;--abaya:#4B5A50;--avbg:#EBEFEA}
  .av.p7{--skin:#C68B5E;--hijab:#2C2320;--abaya:#5E4C39;--avbg:#F0EAE1}
  .eav{width:46px; height:46px; border-radius:50%; border:1.6px dashed rgba(20,89,63,.3);
    flex:none; display:grid; place-items:center; color:rgba(20,89,63,.4)}

  .prow{display:flex; align-items:center; gap:11px; border-radius:17px; padding:11px 13px;
    background:#fff; box-shadow:var(--card); width:100%}
  .prow .nm b{display:block; font-size:13.5px; line-height:1.45}
  .prow .nm span{display:block; font-size:11px; color:var(--dim2); line-height:1.5}

  .thumb{width:80px; height:64px; border-radius:13px; flex:none; background-size:cover;
    background-position:center; box-shadow:0 0 0 1px rgba(198,168,111,.5), 0 6px 16px -7px rgba(11,53,39,.6)}
  .banner{height:120px; border-radius:18px; position:relative; overflow:hidden; background-size:cover;
    background-position:center; display:flex; align-items:flex-end; padding:13px;
    box-shadow:0 0 0 1px rgba(198,168,111,.45), 0 16px 32px -18px rgba(11,53,39,.7)}
  .banner::after{content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(11,53,39,0) 30%, rgba(9,43,31,.86))}
  .banner .bt{position:relative; z-index:2; color:#fff}
  .banner .bt b{display:block; font-size:14px} .banner .bt span{display:block; font-size:11px; opacity:.85}

  .meta{display:flex; padding:13px 2px; border-radius:18px; background:#fff; box-shadow:var(--card)}
  .meta > div{flex:1; text-align:center; padding:0 5px; border-inline-start:1px solid rgba(20,89,63,.1)}
  .meta > div:first-child{border:0}
  .meta .k{display:flex; align-items:center; justify-content:center; gap:4px; font-size:10px;
    color:var(--dim2); margin-bottom:4px}
  .meta b{display:block; font-size:12.5px; font-weight:700; line-height:1.45}
  .meta b span{display:block; font-weight:400; font-size:11px; color:var(--dim)}

  .kpi{position:relative; border-radius:17px; padding:13px 6px; text-align:center; background:#fff; box-shadow:var(--card)}
  .kpi::after{content:""; position:absolute; top:0; left:24px; right:24px; height:1.5px; border-radius:2px;
    background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
  .kpi b{display:block; font-size:19px; font-weight:800; color:var(--g); line-height:1.35}
  .kpi span{font-size:10.5px; color:var(--dim2)}

  .note{border-radius:15px; padding:12px 13px; font-size:12px; display:flex; gap:9px;
    align-items:flex-start; line-height:1.7}
  .note.a{background:#FCF5E7; color:#7A5512; box-shadow:inset 0 0 0 1px rgba(198,168,111,.4)}
  .note.g{background:#E9F4EE; color:#0B5A3B; box-shadow:inset 0 0 0 1px rgba(11,138,75,.18)}
  .note.r{background:#FCEDEB; color:#93261C; box-shadow:inset 0 0 0 1px rgba(192,57,43,.18)}
  .note.b{background:#EDF2F8; color:#2A4A73; box-shadow:inset 0 0 0 1px rgba(42,74,115,.15)}
  .note .ic{margin-top:2px}

  .box{width:23px; height:23px; border-radius:8px; border:1.7px solid rgba(20,89,63,.24);
    flex:none; display:grid; place-items:center; color:#fff; background:#fff}
  .box.on{background:linear-gradient(150deg,var(--g3),var(--g2)); border-color:transparent}
  .tick{width:22px; height:22px; border-radius:8px; flex:none; border:1.7px solid rgba(20,89,63,.22);
    display:grid; place-items:center; color:#fff; background:#fff}
  .tick.on{background:linear-gradient(150deg,#12A05A,#0A7040); border-color:transparent}

  .meter{height:7px; border-radius:99px; background:#EDEAE0; overflow:hidden}
  .meter i{display:block; height:100%; background:linear-gradient(90deg,#12A05A,#0A7040); border-radius:99px}

  .map{height:170px; border-radius:18px; position:relative; overflow:hidden;
    box-shadow:0 0 0 1px rgba(198,168,111,.45), 0 16px 30px -20px rgba(11,53,39,.6)}
  .map svg{position:absolute; inset:0; width:100%; height:100%}
  .ring{position:absolute; inset-block-start:50%; inset-inline-start:50%; transform:translate(50%,-50%);
    width:132px; height:132px; border-radius:50%; background:rgba(11,138,75,.14); border:1.6px solid rgba(11,138,75,.55)}
  .ring.bad{background:rgba(192,57,43,.1); border-color:rgba(192,57,43,.42)}
  .dot{position:absolute; inset-block-start:50%; inset-inline-start:50%; transform:translate(50%,-50%);
    width:17px; height:17px; border-radius:50%; background:var(--g); border:3px solid #fff;
    box-shadow:0 2px 8px rgba(11,53,39,.5)}
  .dot.me{background:var(--live)} .dot.bad{background:var(--red)}
  .scale{position:absolute; bottom:9px; inset-inline-start:10px; background:#fff; border-radius:9px;
    padding:3px 10px; font-size:10px; color:#5A6C63; font-weight:700; box-shadow:0 2px 8px -3px rgba(11,53,39,.5)}
  .legend{position:absolute; bottom:9px; inset-inline-end:10px; background:#fff; border-radius:9px;
    padding:3px 10px; font-size:10px; color:#5A6C63; font-weight:700; box-shadow:0 2px 8px -3px rgba(11,53,39,.5)}

  .timer{display:flex; justify-content:center; align-items:baseline; gap:8px; font-variant-numeric:tabular-nums}
  .timer b{font-size:33px; color:var(--g); font-weight:800; letter-spacing:.01em}
  .timer i{font-size:26px; color:rgba(20,89,63,.28); font-style:normal}
  .tunits{display:flex; justify-content:center; gap:38px; font-size:10px; color:var(--dim2); margin-top:2px}

  .sub{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid rgba(20,89,63,.08); width:100%}
  .sub:last-child{border-bottom:0}
  .sub .t{flex:1; font-size:13px; text-align:right}
  .sub.next{background:rgba(11,138,75,.08); margin:2px -8px; padding:11px 8px; border-radius:12px; border:0}

  .field{display:flex; align-items:center; gap:10px; border-radius:15px; padding:13px;
    color:var(--ink); font-size:13.5px; background:#fff;
    box-shadow:inset 0 0 0 1px rgba(20,89,63,.12), 0 1px 2px rgba(11,53,39,.04); width:100%}
  .field input,.field select{border:0; outline:0; background:none; font:inherit; color:inherit; width:100%; padding:0}
  .field .ph{color:var(--dim2)}

  .seg{display:flex; gap:5px; padding:4px; background:#EFF1ED; border-radius:14px}
  .seg button{flex:1; padding:9px; border-radius:11px; font-size:12.5px; font-weight:700;
    color:var(--dim); text-align:center}
  .seg button.on{background:#fff; color:var(--g); box-shadow:0 2px 6px -2px rgba(11,53,39,.25)}

  .listitem{display:flex; align-items:center; gap:12px; padding:14px; background:#fff;
    border-radius:16px; box-shadow:var(--card); width:100%}
  .listitem .ico{width:38px; height:38px; border-radius:12px; display:grid; place-items:center;
    background:#EFF4F0; color:var(--g); flex:none}

  /* ---------- sheet ---------- */
  .scrim{position:absolute; inset:0; background:rgba(9,24,18,.45); z-index:50; opacity:0;
    animation:fade .22s forwards}
  @keyframes fade{to{opacity:1}}
  .sheet{position:absolute; inset-inline:0; bottom:0; z-index:51; background:#fff;
    border-radius:26px 26px 0 0; padding:10px 16px 22px; max-height:82%; overflow-y:auto;
    transform:translateY(100%); animation:up .28s cubic-bezier(.32,.72,0,1) forwards;
    box-shadow:0 -20px 50px -20px rgba(11,53,39,.55)}
  @keyframes up{to{transform:translateY(0)}}
  .grip{width:38px; height:4px; border-radius:99px; background:#DDE2DC; margin:2px auto 12px}
  .sheet h3{margin:0 0 4px; font-size:17px}
  @media (prefers-reduced-motion: reduce){ .sheet,.scrim{animation:none; transform:none; opacity:1} }

  /* تنبيهات ثابتة أعلى الصفحة */
  .alerts{display:flex; flex-direction:column; gap:8px}
  .alert{display:flex; gap:11px; align-items:flex-start; width:100%; border-radius:16px; padding:12px 13px;
    color:#fff; text-align:right; box-shadow:0 10px 24px -12px rgba(11,53,39,.6)}
  .alert b{display:block; font-size:13.5px}
  .alert span span{display:block; font-size:11.5px; opacity:.9; line-height:1.6}
  .alert.warn{background:linear-gradient(150deg,#B8791A,#7A5512)}
  .alert.bad{background:linear-gradient(150deg,#C0392B,#7E241B)}
  .alert.ok{background:linear-gradient(150deg,#1A6B4C,#0B3527)}

  /* تنبيه بارز يهبط من الأعلى عند وصول إشعار جديد */
  .push{position:relative; z-index:5; border-radius:18px; padding:12px 14px;
    display:flex; gap:11px; align-items:flex-start; color:#fff; cursor:pointer;
    background:linear-gradient(150deg,#1A6B4C,#0B3527);
    box-shadow:0 0 0 1px rgba(198,168,111,.5), 0 22px 40px -14px rgba(0,0,0,.75);
    animation:drop .34s cubic-bezier(.32,.72,0,1)}
  .push.warn{background:linear-gradient(150deg,#B8791A,#7A5512)}
  .push.bad{background:linear-gradient(150deg,#C0392B,#7E241B)}
  .push b{display:block; font-size:13.5px}
  .push span{display:block; font-size:11.5px; opacity:.88; line-height:1.6}
  .push .x{opacity:.7; padding:2px}
  @keyframes drop{from{transform:translateY(-130%); opacity:0} to{transform:translateY(0); opacity:1}}
  @media (prefers-reduced-motion: reduce){ .push{animation:none} }

    background: linear-gradient(150deg, var(--g3), var(--g2)); color: #fff;
    box-shadow: 0 12px 26px -12px rgba(11,53,39,.8); }
</style>
<style>
  /* ===================== النسخة ١٫٨ — الشريط ملتصق بحافة الشاشة ===================== */
  @media (max-width: 520px) {
    /* الشريط يُثبَّت على حافة الشاشة نفسها، لا داخل الحاوية —
       فلا يمكن أن يبقى تحته شيء مهما فعلت الحاوية أو الحافة الآمنة */
    .tabs {
      position: fixed; inset-inline: 0; bottom: 0; z-index: 20;
      padding: 6px 4px 0;
    }
    .tabs::after {
      content: ""; position: absolute; inset-inline: 0; top: 100%;
      height: env(safe-area-inset-bottom); background: #fff; pointer-events: none;
    }
    .app-standalone .tabs { padding-bottom: 0; }
    /* المحتوى يترك مكانًا للشريط الثابت */
    .view { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
    .toast { bottom: calc(96px + env(safe-area-inset-bottom)); }
    /* الأوراق المنبثقة فوق الشريط دائمًا */
    .scrim { z-index: 50; } .sheet { z-index: 51; }
  }
</style>

const now = () => Date.now() + (S && S.clockOffset ? S.clockOffset : 0) * MIN;
const AR = n => String(n).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const two = n => (n < 10 ? '0' : '') + n;
const dayStart = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };

function t12(ts) {
  const d = new Date(ts); let h = d.getHours(); const m = d.getMinutes();
  const s = h < 12 ? 'ص' : 'م'; h = h % 12 || 12;
  return AR(two(h) + ':' + two(m)) + ' ' + s;
}
function hijri(ts) {
  try {
    return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-arab',
      { day: '2-digit', month: '2-digit', year: 'numeric' }).format(new Date(ts)).replace(/\s*هـ?$/, '');
  } catch (e) { const d = new Date(ts); return AR(d.getFullYear() + '/' + two(d.getMonth() + 1) + '/' + two(d.getDate())); }
}
const greg = ts => { const d = new Date(ts); return AR(two(d.getDate()) + '/' + two(d.getMonth() + 1) + '/' + d.getFullYear()); };
const dayName = ts => ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][new Date(ts).getDay()];
const isoDate = ts => { const d = new Date(ts); return d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate()); };

function ago(ts) {
  const d = Math.max(0, now() - ts), m = Math.floor(d / MIN);
  if (m < 1) return 'الآن';
  if (m < 60) return 'قبل ' + AR(m) + ' دقيقة';
  const h = Math.floor(m / 60); if (h < 24) return 'قبل ' + AR(h) + ' ساعة';
  const dd = Math.floor(h / 24); return dd === 1 ? 'أمس' : 'قبل ' + AR(dd) + ' أيام';
}
function untilTxt(ts) {
  const d = ts - now(); const a = Math.abs(d), m = Math.floor(a / MIN);
  const s = d < 0 ? 'منذ ' : 'بعد ';
  if (m < 60) return s + AR(m) + ' دقيقة';
  const h = Math.floor(m / 60);
  if (h < 24) return s + AR(h) + ' ساعة' + (m % 60 ? ' و' + AR(m % 60) + ' د' : '');
  const dd = Math.round(h / 24); return dd === 1 ? (d < 0 ? 'أمس' : 'غدًا') : s + AR(dd) + ' أيام';
}
function hms(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return { h: two(Math.floor(s / 3600)), m: two(Math.floor(s / 60) % 60), s: two(s % 60) };
}

function makePilgrims(n, seedNo) {

    return {
      id: uid('P'),
      name: f ? PN_F[(i * 3 + seedNo) % PN_F.length] : PN_M[(i * 5 + seedNo) % PN_M.length],
      g: f ? 'f' : 'm', av: f ? 'p' + (5 + i % 3) : 'p' + (1 + i % 4),
      pp: 'A' + (7349120 + i * 7 + seedNo * 31), room: 700 + seedNo * 20 + i,
      flag: null, note: null
    };
  });
}

function newTask(L, kind, start, code) {
  const c = CAT[kind];
  return {
    id: uid('T'), code: '#' + code, kind, title: c.ar, desc: c.desc, photo: c.photo,
    place: c.place, city: c.city, leaderId: L.id, kt: L.kt, orgId: L.orgId,
    start, end: start + c.dur * HR, durH: c.dur,
    status: 'pending_assign',
    assigned: [],
    startedAt: null, endedAt: null, startedBy: null, endedBy: null, autoStarted: false,
    leaderAttendedAt: null, leaderFarKm: 0,

    history: [{ at: Date.now(), text: 'أُنشئت المهمة من كتالوج الأنشطة' }],
    rating: null

}

function seed() {
  const st = {
    v: SCHEMA, clockOffset: 0, myPlace: 'site', session: null, route: { n: 'login' },
    tab: {}, orgs: ORGS, users: USERS, tasks: [], tickets: [], notifs: [],
    requests: [], reminders: [], pilgrims: {}, photos: [], guides: {},
    shifts: {}, attend: [], swaps: [], broadcasts: [], tabPage: 0, toast: null
  };
  S = st;   /* لتعمل الدوال المعتمِدة على S أثناء التهيئة */

  USERS.filter(u => u.role === 'leader').forEach((L, li) => {
    st.pilgrims[L.kt] = makePilgrims(L.pilgrims, li + 1);
    PLAN.forEach((p, idx) => {
      st.tasks.push(newTask(L, p.k, Date.now() + p.h * HR, 1200 + idx * 7 + li * 3));
    });
  });

  /* المهام الماضية: تُسكَّن وتُنفَّذ وتُقيَّم لتظهر أمثلة حقيقية للتقييم */
  st.tasks.filter(t => t.start < Date.now()).forEach((t, i) => {
    const team = st.users.filter(u => u.role === 'muhsen' && u.leaderId === t.leaderId);
    const take = team.slice(0, 2 + (i % 3));
    take.forEach((m, k) => {
      const late = (i + k) % 4 === 0;
      t.assigned.push({
        muhsenId: m.id, req: 'accepted', reqAt: t.start - 30 * HR, reqNote: '',
        respAt: t.start - 28 * HR, respNote: '',
        attendedAt: (i + k) % 7 === 0 ? null : t.start + (late ? 20 : -90) * MIN,
        farKm: 0.4, removed: false, removedWhy: null
      });
    });
    if (i % 3 === 1 && team[4]) t.assigned.push({
      muhsenId: team[4].id, req: 'rejected', reqAt: t.start - 30 * HR, reqNote: '',
      respAt: t.start - 29 * HR, respNote: 'مرتبط بمهمة أخرى', attendedAt: null,
      farKm: 0, removed: false, removedWhy: null
    });

    t.leaderAttendedAt = i % 5 === 0 ? null : t.start - 100 * MIN;
    t.leaderFarKm = 0.6;
    t.autoStarted = i % 4 === 0;
    t.startedAt = t.start + (t.autoStarted ? 0 : (i % 5 === 2 ? 35 : -12)) * MIN;
    t.startedBy = t.autoStarted ? 'SYSTEM' : t.leaderId;
    const doneCount = Math.max(2, t.subs.length - (i % 4));
    t.subs.forEach((s, k) => {
      if (k < doneCount) { s.done = true; s.at = t.start + (k + 1) * 18 * MIN; s.by = take[k % take.length].muhsenId; }
    });
    t.endedAt = t.end + (i % 3 === 0 ? -25 : 15) * MIN;
    t.endedBy = t.leaderId;
    t.status = 'done';
    autoNote(t);
    rateTask(t, i);
    t.history.unshift({ at: t.endedAt, text: 'أُغلقت المهمة' });
  });

  /* التذاكر — كلها تصل الليدر */
  TICKET_SEED.forEach((k, i) => {
    const lead = USERS.filter(u => u.role === 'leader')[i % 3];
    const tks = st.tasks.filter(t => t.leaderId === lead.id);
    const tk = tks[i % tks.length];
    const pls = st.pilgrims[lead.kt];
    const pl = pls[i % pls.length];
    const team = USERS.filter(u => u.role === 'muhsen' && u.leaderId === lead.id);
    const fromMuhsen = k.src === 'محسن' ? team[i % team.length] : null;
    st.tickets.push({
      id: uid('K'), no: 'TK-' + (4100 + i), title: k.t, body: k.body, cat: k.cat, src: k.src, pri: k.pri,
      leaderId: lead.id, taskId: tk.id, pilgrimId: k.src === 'حاج' ? pl.id : null,
      from: k.src === 'حاج' ? pl.name : k.src === 'محسن' ? fromMuhsen.name : 'غرفة العمليات — الكنترول',
      fromId: k.src === 'محسن' ? fromMuhsen.id : null,
      fromAv: k.src === 'حاج' ? pl.av : (fromMuhsen ? fromMuhsen.av : null),
      fromG: k.src === 'حاج' ? pl.g : (fromMuhsen ? fromMuhsen.g : null),
      at: Date.now() - k.ago * MIN, status: 'مفتوحة', assignedTo: null, replies: [], escalated: false
    });
  });

  seedPhotos(st);
  seedGuides(st);
  seedDaily(st);
  return st;
}

/* ============================ الأدوار ============================ */
const me = () => (S.session ? S.users.find(u => u.id === S.session.id) : null) || null;
const isLeader = () => { const u = me(); return !!u && u.role === 'leader'; };
const userById = id => S.users.find(u => u.id === id);
const orgOf = t => S.orgs.find(o => o.id === t.orgId);
const taskById = id => S.tasks.find(t => t.id === id);
const teamOf = leaderId => S.users.filter(u => u.role === 'muhsen' && u.leaderId === leaderId);
const pilgrimsOf = kt => S.pilgrims[kt] || [];
const ktCount = kt => { const L = S.users.find(u => u.kt === kt); return L ? L.pilgrims : 0; };

const slotOf = (t, id) => t.assigned.find(a => a.muhsenId === id && !a.removed);
const activeSlots = t => t.assigned.filter(a => !a.removed && a.req !== 'rejected');
const acceptedSlots = t => t.assigned.filter(a => !a.removed && a.req === 'accepted');
const pendingSlots = t => t.assigned.filter(a => !a.removed && a.req === 'pending');

function actsAsLeader(t, id) {
  if (t.leaderId === id) return true;
  return !!(t.delegate && t.delegate.muhsenId === id && t.delegate.state === 'accepted');
}
/* الليدر الذي أسند صفته يتابع ولا يقرّر — القرار للمفوَّض وحده */
function canDecide(t, id) {
  if (!actsAsLeader(t, id)) return false;
  if (t.delegate && t.delegate.state === 'accepted') return t.delegate.muhsenId === id;
  return true;
}
const watching = (t, id) => actsAsLeader(t, id) && !canDecide(t, id);
const isDelegate = (t, id) => !!(t.delegate && t.delegate.muhsenId === id && t.delegate.state === 'accepted');
const ownerOf = t => (t.delegate && t.delegate.state === 'accepted') ? t.delegate.muhsenId : t.leaderId;

/* ============================ حالة المهمة ============================ */
const STATUS = {
  pending_assign: { t: 'بانتظار التسكين', c: 'wait' },
  assigned:       { t: 'مُسكَّنة',        c: 'blue' },
  running:        { t: 'جارية',           c: 'live' },
  done:           { t: 'منتهية',          c: 'grey' },
  cancelled:      { t: 'ملغاة',           c: 'no' }
};

function recomputeStatus(t) {
  if (['done', 'cancelled', 'running'].includes(t.status)) return t.status;
  t.status = acceptedSlots(t).length >= MIN_ASSIGN ? 'assigned' : 'pending_assign';
  return t.status;
}
function canStart(t, id) {
  if (!['pending_assign', 'assigned'].includes(t.status)) return false;
  if (!actsAsLeader(t, id)) return false;
  return now() >= earlyStartFrom(t) && now() < t.start;
}
const lockedForAssign = t => now() >= t.start || ['running', 'done', 'cancelled'].includes(t.status);

/* ============================ التنبيهات ============================ */
function notify(toId, icon, title, body, route) {
  S.notifs.unshift({ id: uid('N'), to: toId, icon, title, body, at: now(), read: false, route: route || null });
  if (typeof pushBridge === 'function') { const _n = S.notifs[0];
    setTimeout(function () { pushBridge(toId, title, body, _n && _n.id); }, 0); }
}
const unread = () => S.notifs.filter(n => n.to === (S.session && S.session.id) && !n.read).length;
const myNotifs = () => S.notifs.filter(n => n.to === (S.session && S.session.id));

function hist(t, text) { t.history.unshift({ at: now(), text }); }
function note(t, text, kind) { t.notes.push({ at: now(), kind: kind || 'auto', text }); }

/* ملاحظات تلقائية تُسجَّل على المهمة */
function autoNote(t) {
  const acc = acceptedSlots(t);
  if (!acc.length) note(t, 'لم يُسكَّن أي محسن على المهمة');
  else if (acc.length < MIN_ASSIGN) note(t, 'التسكين ناقص — ' + AR(acc.length) + ' محسن فقط، والحد الأدنى ' + AR(MIN_ASSIGN));
  acc.forEach(a => {
    const nm = userById(a.muhsenId).name;
    if (!a.attendedAt) note(t, 'لم يثبت ' + nm + ' حضوره');
    else if (a.attendedAt > t.start) note(t, 'تأخر ' + nm + ' في التحضير — أثبت حضوره بعد بداية المهمة');
  });
  const own = userById(ownerOf(t));
  if (!t.leaderAttendedAt && own) note(t, 'لم يثبت ' + own.name + ' حضوره');
  if (t.autoStarted) note(t, 'بدأها النظام تلقائيًا — لم يبدأها المسؤول عنها');
  else if (t.startedAt && t.startedAt > t.start) note(t, 'بدأت متأخرة ' + AR(Math.round((t.startedAt - t.start) / MIN)) + ' دقيقة');
}

/* ============================ التقييم ============================ */
function systemScore(t) {
  const acc = acceptedSlots(t);
  let prep = 0;
  if (acc.length) {
    const good = acc.filter(a => a.attendedAt && a.attendedAt <= t.start).length;
    const half = acc.filter(a => a.attendedAt && a.attendedAt > t.start).length;
    prep = (good + half * 0.5) / acc.length;
  }
  if (acc.length < MIN_ASSIGN) prep *= 0.5;
  if (t.leaderAttendedAt && t.leaderAttendedAt <= t.start) prep = Math.min(1, prep + 0.1);

  const startScore = t.autoStarted ? 0
    : t.startedAt && t.startedAt <= t.start ? 1
    : t.startedAt ? Math.max(0, 1 - (t.startedAt - t.start) / (60 * MIN)) : 0;
  const subs = t.subs.length ? t.subs.filter(s => s.done).length / t.subs.length : 0;
  const close = !t.endedAt ? 0 : t.endedAt <= t.end ? 1
    : Math.max(0, 1 - (t.endedAt - t.end) / (60 * MIN));

  const pct = prep * 0.40 + startScore * 0.20 + subs * 0.25 + close * 0.15;
  return {
    stars: Math.max(1, Math.round(pct * 5 * 2) / 2),
    breakdown: {
      prep: Math.round(prep * 100), start: Math.round(startScore * 100),
      subs: Math.round(subs * 100), close: Math.round(close * 100), total: Math.round(pct * 100)
    }
  };
}

function rateTask(t, salt) {
  const sys = systemScore(t);
  const s = (salt == null ? (t.code.replace(/\D/g, '') | 0) : salt);
  const clamp = v => Math.max(1, Math.min(5, Math.round(v * 2) / 2));
  t.rating = {
    system: sys.stars, breakdown: sys.breakdown,
    supervisor: clamp(sys.stars + ((s % 5) - 2) * 0.5),
    pilgrims:   clamp(sys.stars + (((s + 3) % 5) - 2) * 0.5),
    supNote: SUP_NOTES[s % SUP_NOTES.length],
    pilNote: PIL_NOTES[s % PIL_NOTES.length],
    at: t.endedAt || now()
  };
  return t.rating;
}
const avgRating = r => r ? Math.round(((r.system + r.supervisor + r.pilgrims) / 3) * 10) / 10 : 0;

function personRating(id) {
  const u = userById(id); if (!u) return { avg: 0, n: 0, sys: 0, sup: 0, pil: 0 };
  const ts = S.tasks.filter(t => t.status === 'done' && t.rating &&
    (u.role === 'leader' ? t.leaderId === id : acceptedSlots(t).some(a => a.muhsenId === id)));
  if (!ts.length) return { avg: 0, n: 0, sys: 0, sup: 0, pil: 0 };
  const m = k => Math.round((ts.reduce((a, t) => a + t.rating[k], 0) / ts.length) * 10) / 10;
  const sys = m('system'), sup = m('supervisor'), pil = m('pilgrims');
  return { avg: Math.round(((sys + sup + pil) / 3) * 10) / 10, n: ts.length, sys, sup, pil };
}

function personNotes(id) {
  const u = userById(id); if (!u) return [];
  const out = [];
  S.tasks.forEach(t => (t.notes || []).forEach(n => {
    if (n.text.includes(u.name)) out.push({ at: n.at, t, text: n.text });
  }));
  return out.sort((a, b) => b.at - a.at);
}

/* ============================ سجل الطلبات ============================ */
function addReq(kind, from, to, taskId, note_) {
  const r = { id: uid('Q'), kind, from, to, taskId, note: note_ || '',
    at: now(), state: 'pending', respAt: null, respNote: '' };
  S.requests.unshift(r); return r;
}
function closeReq(taskId, toId, kind, state, note_, photoId) {

    (toId ? x.to === toId : true));
  if (r) { r.state = state; r.respAt = now(); r.respNote = note_ || ''; if (photoId) r.respPhoto = photoId; }
  return r;
}
const reqTask = r => taskById(r.taskId);

/* ============================ إجراءات التسكين ============================ */
function sendRequest(t, muhsenId, note_) {
  if (lockedForAssign(t)) return false;
  const ex = t.assigned.find(a => a.muhsenId === muhsenId && !a.removed);
  if (ex && ex.req !== 'rejected') return false;
  if (ex) { ex.removed = true; ex.removedWhy = 'أُعيد الإرسال'; }
  t.assigned.push({ muhsenId, req: 'pending', reqAt: now(), reqNote: note_ || '',
    respAt: null, respNote: '', attendedAt: null, farKm: 0, removed: false, removedWhy: null });
  addReq('تسكين', t.leaderId, muhsenId, t.id, note_);
  hist(t, 'أُرسل طلب تسكين إلى ' + userById(muhsenId).name);
  notify(muhsenId, 'i-assign', 'طلب تسكين جديد',
    '«' + t.title + '» · تبدأ ' + t12(t.start) + ' ' + hijri(t.start), { n: 'requests' });
  recomputeStatus(t); return true;
}
function withdrawRequest(t, muhsenId) {
  const a = slotOf(t, muhsenId); if (!a) return;
  a.removed = true; a.removedWhy = 'سحب الليدر الطلب';
  closeReq(t.id, muhsenId, 'تسكين', 'withdrawn', 'سحبه الليدر');
  hist(t, 'سحب الليدر طلب التسكين المرسل إلى ' + userById(muhsenId).name);

  recomputeStatus(t);
}
function removeAssignee(t, muhsenId, why, excuse) {
  const a = slotOf(t, muhsenId); if (!a) return;
  a.removed = true; a.removedWhy = why || 'أزاله الليدر';
  if (excuse) a.removePhoto = attachExcuse(t.id, excuse, 'مرفق قرار الإزالة', S.session.id);
  hist(t, 'أُزيل ' + userById(muhsenId).name + ' من المهمة — ' + a.removedWhy);
  note(t, 'أُزيل ' + userById(muhsenId).name + ' من التسكين — ' + a.removedWhy);
  notify(muhsenId, 'i-xc', 'أُزلت من المهمة', '«' + t.title + '» — ' + a.removedWhy, { n: 'tasks' });

}
function respondRequest(t, muhsenId, ok, note_, excuse) {
  const a = t.assigned.find(x => x.muhsenId === muhsenId && x.req === 'pending' && !x.removed);
  if (!a) return;
  a.req = ok ? 'accepted' : 'rejected'; a.respAt = now(); a.respNote = note_ || '';
  if (excuse) a.respPhoto = attachExcuse(t.id, excuse, 'مرفق عذر — ' + userById(muhsenId).name, muhsenId);
  closeReq(t.id, muhsenId, 'تسكين', ok ? 'accepted' : 'rejected', note_, a.respPhoto);
  const nm = userById(muhsenId).name;
  hist(t, (ok ? 'قبِل ' : 'رفض ') + nm + ' التسكين' + (note_ ? ' — «' + note_ + '»' : ''));
  notify(t.leaderId, ok ? 'i-checkc' : 'i-xc', ok ? 'قبول طلب تسكين' : 'رفض طلب تسكين',
    nm + (ok ? ' قبل ' : ' رفض ') + 'التسكين على «' + t.title + '»' + (note_ ? ' — «' + note_ + '»' : ''),
    { n: 'assign', id: t.id });
  recomputeStatus(t);
  if (t.status === 'assigned') notify(t.leaderId, 'i-checkc', 'اكتمل التسكين',
    '«' + t.title + '» صار عليها ' + AR(acceptedSlots(t).length) + ' محسنين.', { n: 'task', id: t.id });
}

/* ============================ التفويض — للشركات فقط ============================ */
function sendDelegate(t, muhsenId, keepDuties) {
  t.delegate = { muhsenId, keepGroup: keepDuties, state: 'pending', at: now() };
  addReq('تفويض', t.leaderId, muhsenId, t.id, keepDuties ? 'مع الإبقاء على مهامه كمحسن' : 'ليدر لهذه المهمة فقط');
  hist(t, 'أُرسل طلب إسناد صلاحية القيادة إلى ' + userById(muhsenId).name);
  notify(muhsenId, 'i-shield', 'إسناد صلاحية القيادة',
    'أُسندت إليك قيادة «' + t.title + '».', { n: 'requests' });
}
function respondDelegate(t, ok, note_, excuse) {
  if (!t.delegate) return;
  const nm = userById(t.delegate.muhsenId).name;
  const ph = excuse ? attachExcuse(t.id, excuse, 'مرفق عذر — ' + nm, t.delegate.muhsenId) : null;
  closeReq(t.id, t.delegate.muhsenId, 'تفويض', ok ? 'accepted' : 'rejected', note_, ph);
  if (ok) {
    t.delegate.state = 'accepted'; t.delegate.respAt = now();
    if (!t.delegate.keepGroup) {
      const a = slotOf(t, t.delegate.muhsenId);
      if (a) { a.removed = true; a.removedWhy = 'تفرّغ للقيادة'; }
    }
    hist(t, 'قبِل ' + nm + ' إسناد صلاحية القيادة');
  } else { hist(t, 'رفض ' + nm + ' إسناد صلاحية القيادة' + (note_ ? ' — «' + note_ + '»' : '')); t.delegate = null; }
  notify(t.leaderId, ok ? 'i-shield' : 'i-xc', ok ? 'قبول التفويض' : 'رفض التفويض',
    nm + (ok ? ' قبل قيادة «' + t.title + '»' : ' رفض التفويض') + (note_ ? ' — «' + note_ + '»' : ''),
    { n: 'task', id: t.id });
  recomputeStatus(t);
}

/* ============================ الحضور والتنفيذ ============================ */
const myFarKm = () => (S.myPlace === 'site' ? 0.4 : S.myPlace === 'hq' ? 1.4 : 3.4);
/* التحضير لا يُقبل إلا من داخل نطاق ٢ كم من حدود الموقع */
const canAttend = t => now() >= prepOpen(t) && myFarKm() <= RADIUS_KM;
function attendBlockReason(t) {
  if (now() < prepOpen(t)) return 'يفتح التحضير من بداية يوم المهمة';
  if (myFarKm() > RADIUS_KM) return 'أنت خارج النطاق — ' + AR(myFarKm()) + ' كم، والمسموح ' + AR(RADIUS_KM) + ' كم';
  return '';
}
function attend(t, who) {
  const u = userById(who); if (!u) return false;
  const far = myFarKm();
  if (far > RADIUS_KM) return false;   /* حارس أخير: لا يُسجَّل حضور من خارج النطاق */
  if (actsAsLeader(t, who)) { t.leaderAttendedAt = now(); t.leaderFarKm = far; }
  const a = slotOf(t, who);
  if (a) { a.attendedAt = now(); a.farKm = far; }
  hist(t, 'أثبت ' + u.name + ' حضوره داخل النطاق (' + AR(far) + ' كم)');
  if (now() > t.start) note(t, 'تأخر ' + u.name + ' في التحضير — أثبت حضوره بعد بداية المهمة');
  if (!actsAsLeader(t, who)) notify(ownerOf(t), 'i-checkc', 'إثبات حضور',
    u.name + ' أثبت حضوره في «' + t.title + '».', { n: 'task', id: t.id });
  return true;
}
function startTask(t, by) {
  t.status = 'running'; t.startedAt = now(); t.startedBy = by; t.autoStarted = by === 'SYSTEM';
  hist(t, by === 'SYSTEM' ? 'بدأها النظام تلقائيًا عند حلول وقتها' : 'بدأ ' + userById(by).name + ' المهمة');
  if (by === 'SYSTEM') {
    note(t, 'بدأها النظام تلقائيًا — لم يبدأها المسؤول عنها');
    if (!acceptedSlots(t).length) note(t, 'بدأت بلا أي محسن مسكَّن');
    else if (acceptedSlots(t).length < MIN_ASSIGN) note(t, 'بدأت والتسكين ناقص — ' + AR(acceptedSlots(t).length) + ' محسن');
    notify(ownerOf(t), 'i-warn', 'بدأها النظام',
      '«' + t.title + '» حان وقتها فبدأها النظام. لم تعد تستطيع التسكين — يمكنك إغلاقها فقط.', { n: 'task', id: t.id });
  }
  acceptedSlots(t).forEach(a => notify(a.muhsenId, 'i-play', 'بدأت المهمة',
    '«' + t.title + '» بدأت — ابدأ تنفيذ المهام الفرعية.', { n: 'mytask', id: t.id }));
}
function endTask(t, by) {
  t.status = 'done'; t.endedAt = now(); t.endedBy = by;
  const diff = Math.round((t.end - t.endedAt) / MIN);
  if (diff > 0) note(t, 'انتهت قبل وقتها بـ ' + AR(diff) + ' دقيقة');
  else if (diff < 0) note(t, 'تجاوزت وقتها بـ ' + AR(-diff) + ' دقيقة');
  const undone = t.subs.filter(s => !s.done).length;
  if (undone) note(t, 'أُغلقت و' + AR(undone) + ' مهمة فرعية غير منجزة');
  autoNote(t);
  rateTask(t);
  hist(t, 'أنهى ' + userById(by).name + ' المهمة');
  acceptedSlots(t).forEach(a => notify(a.muhsenId, 'i-star', 'أُغلقت المهمة',
    '«' + t.title + '» انتهت — تقييم النظام ' + t.rating.system + ' من ٥.', { n: 'rating' }));
  notify(t.leaderId, 'i-star', 'تقييم مهمة',
    '«' + t.title + '» — النظام ' + t.rating.system + ' · المشرف ' + t.rating.supervisor + ' · الحجاج ' + t.rating.pilgrims, { n: 'rating' });
}
function cancelTask(t, by, reason, excuse) {
  t.status = 'cancelled'; t.cancelReason = reason;
  if (excuse) t.cancelPhoto = attachExcuse(t.id, excuse, 'مرفق مبرر الإلغاء', by);
  hist(t, 'ألغى ' + userById(by).name + ' المهمة — «' + reason + '»');
  acceptedSlots(t).forEach(a => notify(a.muhsenId, 'i-xc', 'أُلغيت المهمة',
    '«' + t.title + '» أُلغيت — ' + reason, { n: 'tasks' }));
}
function toggleSub(t, s, by) {
  s.done = !s.done; s.at = s.done ? now() : null; s.by = s.done ? by : null;

function addTicket(fromId, title, body, cat, pri, taskId, pilgrimId) {
  const u = userById(fromId);

  const k = {
    id: uid('K'), no: 'TK-' + (4200 + S.tickets.length), title, body, cat, pri: pri || 'متوسطة',
    src: u.role === 'leader' ? 'ليدر' : 'محسن', leaderId, taskId: taskId || null, pilgrimId: pilgrimId || null,
    from: u.name, fromId, fromAv: u.av, fromG: u.g,
    at: now(), status: 'مفتوحة', assignedTo: null, replies: [], escalated: false

function ticketAssign(k, muhsenId, byId) {

function ticketState(k, byId, st) {

function myTasks() {

  if (u.role === 'leader') return S.tasks.filter(t => t.leaderId === u.id).sort((a, b) => a.start - b.start);
  return S.tasks.filter(t => t.assigned.some(a => a.muhsenId === u.id) || isDelegate(t, u.id))
    .sort((a, b) => a.start - b.start);
}
/* تصنيف المهمة بالنسبة للمستخدم الحالي */
/* ============ تصنيف المهام — دروب داون موحّد، وحالة واحدة لكل مهمة ============ */
const TBUCKETS = [
  { k:'all',       l:'كل المهام', i:'i-list',   c:'grey' },
  { k:'running',   l:'جارية',     i:'i-play',   c:'live' },
  { k:'soon',      l:'اليوم',     i:'i-clock',  c:'wait' },
  { k:'next',      l:'قادمة',     i:'i-cal',    c:'blue' },
  { k:'done',      l:'منجزة',     i:'i-checkc', c:'live' },
  { k:'undone',    l:'غير منجزة', i:'i-warn',   c:'no'   },
  { k:'cancelled', l:'ملغاة',     i:'i-cancel', c:'grey' }
];
const bucketOf = k => TBUCKETS.find(b => b.k === k) || TBUCKETS[0];

/* «غير المنجزة» = ما يُدان فيه الشخص وحده، لا كل ما لم يكتمل */
function isBlamed(t, uid_) {
  const u = userById(uid_); if (!u) return false;
  if (u.role === 'muhsen') {
    const s = t.assigned.find(a => a.muhsenId === uid_);
    if (!s) return false;
    if (s.req === 'rejected') return true;
    if (s.removed) return true;
    if (t.status === 'done' && s.req === 'accepted' && !s.attendedAt) return true;
    if (t.status === 'done' && s.attendedAt && s.attendedAt > t.start) return true;
    return false;
  }
  if (t.status !== 'done') return false;
  if (!t.leaderAttendedAt) return true;
  if (t.autoStarted) return true;
  if (t.endedAt && t.endedAt > t.end + 30 * MIN) return true;
  return false;
}

function taskBucket(t, uid_) {
  if (t.status === 'cancelled') return 'cancelled';
  if (isBlamed(t, uid_)) return 'undone';
  if (t.status === 'running') return 'running';
  if (t.status === 'done') return 'done';
  if (dayStart(t.start) === dayStart(now())) return 'soon';
  return 'next';
}

function undoneReason(t, uid_) {
  const u = userById(uid_);
  if (t.status === 'cancelled') return 'أُلغيت المهمة — ' + (t.cancelReason || '');
  if (u.role === 'muhsen') {
    const s = t.assigned.find(a => a.muhsenId === uid_) || {};
    if (s.req === 'rejected') return 'رفضتَ الإسناد' + (s.respNote ? ' — «' + s.respNote + '»' : '');
    if (s.removed) return 'أُزيل إسنادك — ' + (s.removedWhy || 'بقرار من الليدر');
    if (!s.attendedAt) return 'لم تثبت حضورك في المهمة';
    if (s.attendedAt > t.start) return 'تأخرت عن التحضير — أثبت حضورك بعد بدايتها';
    return 'غير منجزة';
  }
  if (!t.leaderAttendedAt) return 'لم تثبت حضورك في المهمة';
  if (t.autoStarted) return 'بدأها النظام — لم تبدأها في وقتها';
  if (t.endedAt && t.endedAt > t.end + 30 * MIN)
    return 'تأخر الإغلاق ' + AR(Math.round((t.endedAt - t.end) / MIN)) + ' دقيقة عن وقت الانتهاء';
  return 'غير منجزة';
}

function currentTask() {
  return myTasks().filter(t => ['running', 'assigned', 'pending_assign'].includes(t.status))
    .filter(t => taskBucket(t, S.session.id) === 'current')[0] || null;
}
function myRequests() {
  const u = me(); if (!u || u.role === 'leader') return [];
  const out = [];
  S.tasks.forEach(t => {
    if (lockedForAssign(t) && t.status !== 'running') return;
    t.assigned.forEach(a => { if (a.muhsenId === u.id && a.req === 'pending' && !a.removed) out.push({ kind: 'assign', t }); });
    if (t.delegate && t.delegate.muhsenId === u.id && t.delegate.state === 'pending') out.push({ kind: 'delegate', t });
  });
  return out;
}
function myTickets() {
  const u = me(); if (!u) return [];
  if (u.role === 'leader') return S.tickets.filter(k => k.leaderId === u.id).sort((a, b) => b.at - a.at);
  return S.tickets.filter(k => k.assignedTo === u.id || k.fromId === u.id).sort((a, b) => b.at - a.at);
}
/* تعارض زمني */
function busyIn(muhsenId, t) {
  return S.tasks.find(x => x.id !== t.id && !['done', 'cancelled'].includes(x.status) &&
    x.start < t.end && t.start < x.end &&
    (x.assigned.some(a => a.muhsenId === muhsenId && !a.removed && a.req !== 'rejected') ||
     (x.delegate && x.delegate.muhsenId === muhsenId && x.delegate.state === 'accepted')));
}
/* مهام لم تُسكَّن بعد — يجب على الليدر تسكينها فورًا */
const unassignedTasks = () => myTasks().filter(t =>

/* ============================ التنبيهات التلقائية والبدء الآلي ============================ */
function autoTick() {
  const t0 = now();
  (S.reminders || []).forEach(r => {
    if (!r.fired && t0 >= r.at) { r.fired = true; notify(r.who, 'i-bell', 'تذكير', r.text, { n: 'calendar' }); }
  });
  S.tasks.forEach(t => {
    t._f = t._f || {};
    /* البدء الآلي عند حلول الوقت */
    if (t0 >= t.start && ['pending_assign', 'assigned'].includes(t.status)) { startTask(t, 'SYSTEM'); return; }
    if (['done', 'cancelled', 'running'].includes(t.status)) return;

    const empty = acceptedSlots(t).length < MIN_ASSIGN;
    if (empty && t0 >= t.start - 7 * DAY && !t._f.w7) {
      notify(t.leaderId, 'i-clock', 'مهمة تحتاج تسكينًا',
        '«' + t.title + '» — ' + hijri(t.start) + ' وما زالت بلا تسكين مكتمل.', { n: 'assign', id: t.id });
      t._f.w7 = 1;
    }
    if (empty && t0 >= t.start - 12 * HR && !t._f.w12) {
      notify(t.leaderId, 'i-warn', 'تحذير: تسكين متأخر',
        'بقي أقل من ١٢ ساعة على «' + t.title + '» والتسكين غير مكتمل.', { n: 'assign', id: t.id });
      t._f.w12 = 1;
    }
    if (t0 >= prepOpen(t) && !t._f.prep) {
      acceptedSlots(t).forEach(a => notify(a.muhsenId, 'i-clock', 'فُتحت نافذة التحضير',
        '«' + t.title + '» تبدأ ' + t12(t.start) + ' — أثبت حضورك.', { n: 'mhome' }));
      notify(ownerOf(t), 'i-clock', 'فُتحت نافذة التحضير',
        '«' + t.title + '» تبدأ ' + t12(t.start) + ' — أثبت حضورك.', { n: 'task', id: t.id });
      t._f.prep = 1;
    }
    if (t0 >= t.start - HR && !t._f.h1) {
      acceptedSlots(t).filter(a => !a.attendedAt).forEach(a =>
        notify(a.muhsenId, 'i-warn', 'بقيت ساعة على المهمة', 'لم تثبت حضورك في «' + t.title + '».', { n: 'mhome' }));
      t._f.h1 = 1;
    }
    const pend = pendingSlots(t).length;
    if (pend && t0 >= t.start - 3 * HR && !t._f.noresp) {
      notify(t.leaderId, 'i-warn', 'طلبات بلا رد',
        AR(pend) + ' طلب لم يُرد عليه في «' + t.title + '».', { n: 'lreq' });
      t._f.noresp = 1;
    }
  });
  S.tasks.forEach(t => {
    if (t.status === 'running' && now() > t.end && !t._f.over) {
      notify(ownerOf(t), 'i-warn', 'المهمة تجاوزت وقتها',
        '«' + t.title + '» تجاوزت وقت الانتهاء ولم تُغلق.', { n: 'task', id: t.id });
      t._f.over = 1;
    }
  });
}

function stars(v, size) {
  const full = Math.floor(v), half = v - full >= 0.5;

const TABS_SIDE = 3;

function tabItems() {
  const L = isLeader();
  const inbox = S.requests.filter(x => x.to === S.session.id && x.state === 'pending').length +
    pendingSwaps().length;
  const openTk = myTickets().filter(k => k.status !== 'مغلقة').length;
  const base = [
    { k:'tasks',   i:'i-tasks',  l:'المهام',    on:['tasks','task','assign','timeline','doc'] },
    { k: L ? 'lreq' : 'requests', i:'i-swap', l:'الطلبات', b:inbox, on:['lreq','requests'] },
    { k:'daily',   i:'i-check',  l:'التحضير',   on:['daily'] },
    { k:'tickets', i:'i-ticket', l:'التذاكر',   b:openTk, on:['tickets','ticket'] },
    { k:'notifs',  i:'i-bell',   l:'الإشعارات', b:unread(), on:['notifs'] },
    { k:'guide',   i:'i-guide',  l:'الدليل',    on:['guide'] },
    { k:'rating',  i:'i-star',   l:'التقييم',   on:['rating','taskrating'] },
    { k:'calendar',i:'i-cal',    l:'التقويم',   on:['calendar'] },
    { k:'album',   i:'i-album',  l:'الصور',     on:['album','photo'] },
    { k:'pilgrims',i:'i-user',   l:'الحجاج',    on:['pilgrims'] }
  ];
  if (L) base.splice(3, 0, { k:'muhsens', i:'i-users', l:'المحسنون', on:['muhsens'] });
  base.push({ k:'more', i:'i-dots', l:'المزيد', on:['more','profile','admin'] });
  return base;
}
const tabPer = () => TABS_SIDE * 2;
const tabPageCount = () => Math.ceil(tabItems().length / tabPer());
function tabPageOf(route) {
  const it = tabItems();
  for (let i = 0; i < it.length; i++) if (it[i].on.indexOf(route) >= 0) return Math.floor(i / tabPer());
  return null;
}

function tabs() {
  const L = isLeader(), r = S.route.n;
  const items = tabItems(), per = tabPer(), pages = tabPageCount();
  const auto = tabPageOf(r);
  if (auto !== null && S._tabAuto !== r) { S.tabPage = auto; S._tabAuto = r; }
  const pg = Math.min(Math.max(S.tabPage || 0, 0), pages - 1);

  const btn = it => {
    if (!it) return '<span class="tspacer"></span>';
    const on = it.on.indexOf(r) >= 0;
    return '<button class="' + (on ? 'on' : '') + '" role="tab"' + (on ? ' aria-selected="true"' : '') +
      ' data-a="go" data-n="' + it.k + '">' +
      '<span class="wi">' + icon(it.i) + (it.b ? '<span class="badge">' + AR(it.b) + '</span>' : '') +
      '</span><span class="tl">' + it.l + '</span></button>';
  };
  const rail = side => {
    let out = '';
    for (let p = 0; p < pages; p++) {
      const base = p * per + (side === 'r' ? 0 : TABS_SIDE);
      let cells = '';
      for (let i = 0; i < TABS_SIDE; i++) cells += btn(items[base + i]);
      out += '<div class="tpage">' + cells + '</div>';
    }
    return '<div class="tside"><div class="trail" style="transform:translateX(' + (pg * 100) + '%)">' +
      out + '</div></div>';
  };
  const homeOn = ['home','mhome'].indexOf(r) >= 0;

  return '<nav class="tabs" role="tablist" aria-label="التنقّل" data-pages="' + pages + '">' +
    (pages > 1 ? '<span class="dots">' + Array.from({ length: pages }, (_, i) =>
      '<button class="' + (i === pg ? 'on' : '') + '" data-a="tabpage" data-v="' + i + '" ' +
      'aria-label="الصفحة ' + AR(i + 1) + '"></button>').join('') + '</span>' : '') +
    rail('r') +
    '<button class="home' + (homeOn ? ' on' : '') + '" role="tab"' + (homeOn ? ' aria-selected="true"' : '') +
      ' data-a="go" data-n="' + (L ? 'home' : 'mhome') + '">' +
      '<span class="wi hb"><i class="mlogo"></i></span>' +
      '<span class="hl">الرئيسية</span></button>' +
    rail('l') +
    '</nav>';
}

/* درجة الإلحاح */
function urgency(t) {
  if (['done', 'cancelled', 'running'].includes(t.status)) return null;
  const left = t.start - now(), acc = acceptedSlots(t).length;
  if (acc >= MIN_ASSIGN) return null;
  if (left < 0) return null;
  if (left < 3 * HR) return { k:'urgent', c:'r', i:'i-warn',
    txt:'تبدأ ' + untilTxt(t.start) + ' — التسكين ناقص (' + AR(acc) + ' من ' + AR(MIN_ASSIGN) + ')' };
  if (left < 24 * HR) return { k:'soon', c:'a', i:'i-clock',
    txt:'تبدأ ' + untilTxt(t.start) + ' — أكمل التسكين' };
  return { k:'', c:'a', i:'i-clock', txt:'بحاجة إلى تسكين — ' + AR(acc) + ' من ' + AR(MIN_ASSIGN) };
}

/* ============================ تنبيهات ثابتة أعلى الصفحة ============================ */
function alertsHTML() {
  if (!S.session) return '';
  const u = me(); if (!u) return '';
  const out = [];
  const box = (cls, ic, title, body, act) =>
    '<button class="alert ' + cls + '" ' + (act || '') + '>' + icon(ic, 's26') +
      '<span class="sp"><b>' + E(title) + '</b><span>' + E(body) + '</span></span>' + icon('i-back','s16') + '</button>';

  if (u.role === 'muhsen') {
    myTasks().filter(t => ['running','assigned','pending_assign'].includes(t.status)).forEach(t => {
      const a = acceptedSlots(t).find(x => x.muhsenId === u.id);
      if (!a || a.attendedAt) return;
      if (now() >= t.start)
        out.push(box('bad', 'i-warn', 'تأخرت عن إثبات الحضور',
          '«' + t.title + '» بدأت ' + t12(t.start) + ' ولم تثبت حضورك — تُسجَّل عليك ملاحظة وتؤثر في تقييمك.',
          'data-a="go" data-n="mhome"'));
      else if (now() >= prepOpen(t)) {
        const r = hms(t.start - now());
        out.push(box('warn', 'i-clock', 'أثبت حضورك',
          '«' + t.title + '» — تبقّى ' + AR(r.h) + ':' + AR(r.m) + ':' + AR(r.s) + ' على بدايتها.',
          'data-a="go" data-n="mhome"'));
      }
    });
    const rq = myRequests().length;
    if (rq) out.push(box('warn', 'i-bell', 'لديك ' + AR(rq) + ' طلب بانتظار ردك',
      'تسكين أو تفويض — لا يكتمل التسكين قبل ردك.', 'data-a="go" data-n="requests"'));
  } else {
    const un = unassignedTasks();
    if (un.length) out.push(box(un.some(t => t.start - now() < 12 * HR) ? 'bad' : 'warn', 'i-assign',
      AR(un.length) + ' مهمة تحتاج تسكينًا',
      'أقربها «' + un[0].title + '» ' + untilTxt(un[0].start) + '. سكّن مبكرًا ولو كانت بعد أسابيع.',
      'data-a="go" data-n="tasks"'));
    const auto = myTasks().filter(t => t.status === 'running' && t.autoStarted);
    if (auto.length) out.push(box('bad', 'i-warn', AR(auto.length) + ' مهمة بدأها النظام',
      'حان وقتها ولم تبدأها — أغلقها، ويُحتسب ذلك في التقييم.',
      'data-a="go" data-n="task" data-id="' + auto[0].id + '"'));
    const notAtt = myTasks().filter(t => ['running','assigned','pending_assign'].includes(t.status) && inPrep(t) && !t.leaderAttendedAt);
    if (notAtt.length) out.push(box('warn', 'i-target', 'أثبت حضورك',
      '«' + notAtt[0].title + '» — التحضير مفتوح منذ بداية اليوم.',
      'data-a="go" data-n="task" data-id="' + notAtt[0].id + '"'));
  }
  if (!out.length) return '';
  const atHome = ['home', 'mhome'].includes(S.route.n);
  if (atHome) return '<div class="alerts">' + out.join('') + '</div>';
  /* خارج الرئيسية: سطر واحد لا يزاحم محتوى الشاشة */
  const worst = out.some(x => x.indexOf('alert bad') >= 0);
  return '<button class="alerts one ' + (worst ? 'bad' : 'warn') + '" data-a="go" data-n="' +
    (u.role === 'leader' ? 'home' : 'mhome') + '">' + icon(worst ? 'i-warn' : 'i-bell', 's18') +
    '<span class="sp">' + AR(out.length) + (out.length === 1 ? ' تنبيه يحتاج إجراءً' : ' تنبيهات تحتاج إجراءً') + '</span>' +
    icon('i-back', 's16') + '</button>';
}

function pendingCountFor(uid_) {
  const u = userById(uid_); if (!u) return 0;
  let n = 0;
  if (u.role === 'muhsen') {
    S.tasks.forEach(t => {
      if (['done','cancelled'].includes(t.status)) return;
      t.assigned.forEach(a => {
        if (a.muhsenId !== uid_ || a.removed) return;
        if (a.req === 'pending') n++;
        if (a.req === 'accepted' && !a.attendedAt && now() >= prepOpen(t)) n++;
      });
      if (t.delegate && t.delegate.muhsenId === uid_ && t.delegate.state === 'pending') n++;
    });
    if (S.tickets.some(k => k.assignedTo === uid_ && k.status !== 'مغلقة')) n++;
  } else {
    S.tasks.filter(t => t.leaderId === uid_).forEach(t => {
      if (!lockedForAssign(t) && acceptedSlots(t).length < MIN_ASSIGN) n++;
      if (t.status === 'running' && t.autoStarted) n++;
      if (t.status === 'running' && now() > t.end) n++;
    });
    if (S.tickets.some(k => k.leaderId === uid_ && k.status === 'مفتوحة')) n++;
  }
  return n;
}

    right: lead ? '<button data-a="go" data-n="timeline" data-id="' + t.id + '" aria-label="سجل الإجراءات">' + icon('i-hist') + '</button>'

    (watch ? '<div class="note b">' + icon('i-shield','s16') +
      '<span><b>الليدر على هذه المهمة: ' + E(userById(t.delegate.muhsenId).name) + '</b><br>' +

/* بطاقة الحضور */
function attendCard(t, u, lead) {
  const a = slotOf(t, u.id);
  const mine = lead ? t.leaderAttendedAt : (a ? a.attendedAt : null);
  const involved = lead || (a && a.req === 'accepted');
  if (!involved) return '';
  if (mine) return '<div class="note g">' + icon('i-checkc','s16') +
    '<span>حضورك مُثبَت ' + t12(mine) + '</span></div>';
  if (now() < prepOpen(t)) return '<div class="note a">' + icon('i-clock','s16') +
    '<span>يفتح التحضير من بداية يوم المهمة — ' + hijri(t.start) + '</span></div>';
  const late = now() >= t.start;
  const r = hms(Math.abs(t.start - now()));
  return '<div class="c gold"><div class="center">' +
    '<div class="tiny dim2" style="margin-bottom:5px">' + (late ? 'تأخرت عن بداية المهمة' : 'المتبقي على بداية المهمة') + '</div>' +
    '<div class="timer" data-deadline="' + t.start + '"><b' + (late ? ' style="color:var(--red)"' : '') + '>' + AR(r.h) +
      '</b><i>:</i><b' + (late ? ' style="color:var(--red)"' : '') + '>' + AR(r.m) +
      '</b><i>:</i><b' + (late ? ' style="color:var(--red)"' : '') + '>' + AR(r.s) + '</b></div>' +
    '<div class="tunits"><span>ساعة</span><span>دقيقة</span><span>ثانية</span></div>' +
    '<div class="tiny ' + (late ? '' : 'dim') + '" style="margin-top:9px' + (late ? ';color:var(--red);font-weight:700' : '') + '">' +
      (late ? 'يُسجَّل تأخرك في ملاحظات المهمة ويؤثر في تقييمك' : 'تبدأ المهمة ' + t12(t.start)) + '</div></div>' +
    mapBox(t, true) +
    '<div class="grid2" style="margin-top:11px">' +
      '<button class="btn g sm" data-a="place">' + icon('i-pin','s16') + 'تغيير موقعي</button>' +
      '<button class="btn p sm" data-a="attend" data-id="' + t.id + '">' + icon('i-target','s16') + 'إثبات الحضور</button></div>' +
    '<div class="tiny dim2 center" style="margin-top:7px">وضع التجربة: الحضور متاح من أي موقع — والبُعد يُسجَّل ملاحظةً</div></div>';
}

function slotRow(t, a, canManage) {
  const u = userById(a.muhsenId);
  let right = '', sub = E(u.code) + ' · ' + E(u.specialty);
  if (a.req === 'pending') { right = pill('بانتظار الرد', 'wait'); sub = 'أُرسل ' + ago(a.reqAt); }
  else if (a.attendedAt) {
    right = '<span class="att">' + icon('i-checkc','s16') + '<span>حاضر<span>' + t12(a.attendedAt) + '</span></span></span>';
    if (a.farKm > RADIUS_KM) sub = 'حضّر من ' + a.farKm + ' كم — خارج النطاق';
  } else right = pill('قبِل', 'live');
  return '<div class="prow">' + avat(u) +
    '<span class="nm sp"><b>' + E(u.name) + '</b><span>' + sub + '</span></span>' + right +
    (canManage ? '<button data-a="smenu" data-id="' + t.id + '" data-u="' + a.muhsenId + '" class="vdots">' +
      icon('i-vdots','s16') + '</button>' : '') + '</div>';
}

function subRow(t, s, i, running) {
  const nextIdx = t.subs.findIndex(x => !x.done);
  const isNext = i === nextIdx && running;
  const shots = photosFor(t.id, s.id).length;
  return '<div class="subrow">' +
    '<button class="sub ' + (isNext ? 'next' : '') + '" ' +
      (running ? 'data-a="sub" data-id="' + t.id + '" data-s="' + s.id + '"' : 'disabled') + '>' +
      '<span class="tick ' + (s.done ? 'on' : '') + '">' + (s.done ? icon('i-check','s14') : '') + '</span>' +
      '<span class="t ' + (s.done ? '' : isNext ? 'b' : 'dim') + '">' + E(s.name) + '</span>' +
      (s.done ? '<span class="tiny dim2">' + t12(s.at) + '</span>' : isNext ? pill('التالية','wait') : '') +
    '</button>' +
    (shots ? '<button class="sshot has" data-a="viewphoto" data-id="' + photosFor(t.id, s.id)[0].id + '" ' +
      'aria-label="إثباتات">' + icon('i-camera','s14') + '<i>' + AR(shots) + '</i></button>'
      : (canShoot() ? '<button class="sshot" data-a="shoot" data-tid="' + t.id + '" data-sid="' + s.id + '" ' +
        'data-kid="" aria-label="توثيق">' + icon('i-camera','s14') + '</button>' : '')) +
    '</div>';
}

function delegCard(t, isCo, canManage) {
  if (!isCo) return '<div class="note a">' + icon('i-shield','s16') +
    '<span>إسناد صلاحية القيادة غير متاح — هذه المهمة تتبع <b>بعثة</b>، والإسناد للشركات فقط.</span></div>';
  if (!t.delegate) return canManage
    ? '<div><div class="lbl">إسناد صلاحية القيادة<small>للشركات فقط · لهذه المهمة وحدها</small></div>' +
      '<button class="field" data-a="deleg" data-id="' + t.id + '">' + icon('i-assign','s16') +
      '<span class="sp ph">اختر محسنًا لإسناد القيادة</span>' + icon('i-down','s16') + '</button></div>' : '';
  const d = t.delegate, u = userById(d.muhsenId);
  return '<div><div class="lbl">إسناد صلاحية القيادة</div><div class="c gold">' +
    '<div class="tiny dim2" style="margin-bottom:9px">' +
      (d.state === 'pending' ? 'بانتظار رد المحسن' : d.state === 'accepted' ? 'الليدر المؤقت لهذه المهمة' : 'رُفض الإسناد') + '</div>' +
    '<div class="fl">' + avat(u, 'lg') + '<span class="sp"><b style="font-size:15px;display:block">' + E(u.name) +
      '</b><span class="tiny dim2">' + E(u.code) + ' · ' + (d.keepGroup ? 'مع بقائه محسنًا في المهمة' : 'ليدر لهذه المهمة فقط') + '</span></span></div>' +
    '<div class="row" style="margin-top:11px">' +
      pill(d.state === 'pending' ? 'بانتظار القبول' : 'يملك صلاحية البدء والإغلاق', d.state === 'pending' ? 'wait' : 'live') +
      (canManage ? '<button data-a="undeleg" data-id="' + t.id + '" style="color:var(--red);font-size:12.5px;font-weight:700">إلغاء الإسناد</button>' : '') +
    '</div></div></div>';
}

/* ============================ شاشة التسكين ============================ */
function screenAssign() {
  const t = taskById(S.route.id); if (!t) return screenTasks();
  recomputeStatus(t);
  const acc = acceptedSlots(t).length;
  const locked = lockedForAssign(t);
  const team = teamOf(t.leaderId);
  const busy = {};
  team.forEach(m => { const b = busyIn(m.id, t); if (b) busy[m.id] = b.title; });

  return bar('التسكين', { back: 1 }) + '<div class="view">' + ground() +
    '<div class="c gold"><div class="row"><b style="font-size:14.5px" class="sp">' + E(t.title) + '</b>' +
      pill(untilTxt(t.start), locked ? 'no' : 'wait') + '</div>' +
      '<div class="meter" style="margin:11px 0 7px"><i style="width:' +
        Math.min(100, Math.round(acc / MIN_ASSIGN * 100)) + '%"></i></div>' +
      '<div class="row tiny dim"><span>' + AR(acc) + ' من الحد الأدنى ' + AR(MIN_ASSIGN) + '</span>' +
      '<span>' + AR(ktCount(t.kt)) + ' حاجًا في ' + E(t.kt) + '</span></div></div>' +

    (locked
      ? '<div class="note r">' + icon('i-warn','s16') + '<span><b>التسكين مقفل</b><br>' +
        (t.status === 'running' ? 'المهمة بدأت — لا تسكين بعد البدء.' : 'حان وقت المهمة.') + '</span></div>'
      : '<div class="note b">' + icon('i-info','s16') +
        '<span>الحد الأدنى ' + AR(MIN_ASSIGN) + ' محسنين. المهمة تبدأ في وقتها على كل حال، والتسكين الناقص يُسجَّل ملاحظةً ويؤثر في التقييم.</span></div>') +

    '<div class="lbl">فريقك<small>' + AR(team.length) + ' محسن · جميعهم يخدمون ' + AR(ktCount(t.kt)) + ' حاجًا</small></div>' +
    team.map(m => {
      const a = slotOf(t, m.id);
      const st = a ? a.req : null;
      const blocked = !!busy[m.id] && !a;
      let right, act = '';
      if (st === 'accepted') { right = pill('مُسكَّن', 'live');
        act = locked ? '' : '<button class="btn d sm" data-a="removeasg" data-id="' + t.id + '" data-u="' + m.id + '">' + icon('i-x','s16') + 'إزالة من المهمة</button>'; }
      else if (st === 'pending') { right = pill('بانتظار الرد · ' + ago(a.reqAt), 'wait');
        act = locked ? '' : '<div class="grid2">' +
          '<a class="btn l sm" href="tel:' + m.phone.replace(/[^0-9]/g,'') + '">' + icon('i-phone','s16') + 'اتصال</a>' +
          '<button class="btn d sm" data-a="withdraw" data-id="' + t.id + '" data-u="' + m.id + '">' + icon('i-x','s16') + 'سحب الطلب</button></div>'; }
      else if (st === 'rejected') { right = pill('رفض', 'no');
        act = locked ? '' : '<button class="btn l sm" data-a="send" data-id="' + t.id + '" data-u="' + m.id + '">' + icon('i-swap','s16') + 'إعادة الإرسال</button>'; }
      else { right = blocked ? pill('مرتبط بمهمة أخرى', 'grey') : pill('متاح', 'grey');
        act = locked ? '' : (blocked
          ? '<div class="tiny dim2">مرتبط بـ«' + E(busy[m.id]) + '» في وقت متداخل</div>'
          : '<button class="btn p sm" data-a="send" data-id="' + t.id + '" data-u="' + m.id + '">' + icon('i-assign','s16') + 'إرسال طلب</button>'); }
      return '<div class="c"><div class="fl">' + avat(m) +
        '<span class="nm sp"><b>' + E(m.name) + '</b><span>' + E(m.code) + ' · ' + E(m.specialty) + '</span></span>' + right + '</div>' +
        (a && a.respNote ? '<div class="note r" style="margin-top:9px">' + icon('i-info','s16') + '<span>' + E(a.respNote) + '</span></div>' : '') +
        (act ? '<div style="margin-top:10px">' + act + '</div>' : '') + '</div>';
    }).join('') +
    '</div>' + tabs();
}

/* ============================ تسلسل الإجراءات — للّيدر فقط ============================ */
function screenTimeline() {
  const t = taskById(S.route.id); if (!t) return screenTasks();
  if (!actsAsLeader(t, S.session.id)) return screenTasks();
  const evs = [];
  t.assigned.forEach(a => {
    const nm = userById(a.muhsenId).name;
    if (a.reqAt) evs.push({ at:a.reqAt, ic:'i-assign', c:'wait', txt:'أُرسل طلب تسكين إلى ' + nm });
    if (a.respAt) evs.push({ at:a.respAt, ic:a.req === 'accepted' ? 'i-checkc' : 'i-xc',
      c:a.req === 'accepted' ? 'live' : 'no',
      txt:nm + (a.req === 'accepted' ? ' قبل التسكين' : ' رفض التسكين') + (a.respNote ? ' — «' + a.respNote + '»' : '') });
    if (a.attendedAt) evs.push({ at:a.attendedAt, ic:'i-target', c:a.farKm > RADIUS_KM ? 'wait' : 'live',
      txt:nm + ' أثبت حضوره' + (a.farKm > RADIUS_KM ? ' من ' + a.farKm + ' كم' : '') });
    if (a.removed) evs.push({ at:a.respAt || a.reqAt, ic:'i-x', c:'no', txt:'أُزيل ' + nm + ' — ' + (a.removedWhy || '') });
  });
  if (t.leaderAttendedAt) evs.push({ at:t.leaderAttendedAt, ic:'i-target', c:'live', txt:'الليدر أثبت حضوره' });
  if (t.delegate) evs.push({ at:t.delegate.at, ic:'i-shield', c:'gold',
    txt:'إسناد القيادة إلى ' + userById(t.delegate.muhsenId).name + ' — ' +
      (t.delegate.state === 'accepted' ? 'قُبل' : t.delegate.state === 'pending' ? 'بانتظار الرد' : 'رُفض') });
  if (t.startedAt) evs.push({ at:t.startedAt, ic:'i-play', c:t.autoStarted ? 'no' : 'live',
    txt:t.autoStarted ? 'بدأها النظام تلقائيًا' : 'بدأ ' + (userById(t.startedBy) || {name:'النظام'}).name + ' المهمة' });
  t.subs.filter(s => s.done).forEach(s => evs.push({ at:s.at, ic:'i-check', c:'grey',
    txt:'أُنجزت «' + s.name + '»' + (s.by && userById(s.by) ? ' — ' + userById(s.by).name : '') }));
  if (t.endedAt) evs.push({ at:t.endedAt, ic:'i-stop', c:'grey',
    txt:'أُغلقت المهمة' + (userById(t.endedBy) ? ' — ' + userById(t.endedBy).name : '') });
  evs.sort((a, b) => b.at - a.at);

  const clr = { no:'background:#FBE9E7;color:#93261C', wait:'background:#FBF1DE;color:#7F5310',
    gold:'background:#F5EDDF;color:#6E5729', grey:'background:#EFF1ED;color:#5A6C63',
    live:'background:#E4F2E9;color:#0B6540' };
  return bar('تسلسل الإجراءات', { back: 1 }) + '<div class="view">' + ground() + svcCard(t) +
    (evs.length ? evs.map(e => '<div class="c"><div class="fl" style="align-items:flex-start;gap:11px">' +
      '<span class="ico" style="width:36px;height:36px;border-radius:12px;display:grid;place-items:center;' + clr[e.c] + '">' +
        icon(e.ic,'s18') + '</span>' +
      '<span class="sp"><b class="sm" style="display:block">' + E(e.txt) + '</b>' +
      '<span class="tiny dim2">' + t12(e.at) + ' · ' + hijri(e.at) + '</span></span></div></div>').join('')
      : '<div class="c center dim sm">لا توجد إجراءات بعد</div>') +
    '</div>' + tabs();
}

/* ============================ صناديق الوضع الآن ============================ */
function statusBoxes() {
  const L = isLeader(), ts = myTasks();
  const running = ts.filter(t => t.status === 'running');
  const auto = running.filter(t => t.autoStarted);
  const soon = ts.filter(t => !['done','cancelled','running'].includes(t.status) && t.start > now() && t.start - now() < 12 * HR);
  const un = L ? unassignedTasks() : [];
  const inbox = L ? 0 : myRequests().length;
  const tks = myTickets().filter(k => k.status !== 'مغلقة').length;
  const over = running.filter(t => now() > t.end);

  const box = (cls, ic, n, title, sub, act) =>
    '<button class="c ' + cls + '" ' + (act || '') + ' style="width:100%;text-align:right">' +
      '<div class="fl" style="gap:11px">' +
        '<span class="ico" style="width:42px;height:42px;border-radius:13px;display:grid;place-items:center;' +
          (cls === 'urgent' ? 'background:#FCEDEB;color:#93261C' : cls === 'soon' ? 'background:#FCF5E7;color:#7A5512'
            : 'background:#E4F2E9;color:#0B6540') + '">' + icon(ic, 's18') + '</span>' +
        '<span class="sp"><b style="font-size:14px;display:block">' + E(title) + '</b>' +
        '<span class="tiny dim">' + E(sub) + '</span></span>' +
        '<b style="font-size:22px;font-weight:800;' +
          (cls === 'urgent' ? 'color:var(--red)' : cls === 'soon' ? 'color:var(--amber)' : 'color:var(--g)') + '">' + AR(n) + '</b>' +
      '</div></button>';

  let out = '<div class="lbl">الوضع الآن<small>' + dayName(now()) + ' · ' + t12(now()) + '</small></div>';
  let any = false;
  if (auto.length)    { any = 1; out += box('urgent','i-warn',auto.length,'مهمة بدأها النظام','حان وقتها ولم تبدأها — أغلقها','data-a="go" data-n="tasks"'); }
  if (over.length)    { any = 1; out += box('urgent','i-clock',over.length,'مهمة تجاوزت وقتها','لم تُغلق بعد انتهاء مدتها','data-a="go" data-n="tasks"'); }
  if (running.length) { any = 1; out += box('','i-play',running.length,'مهمة جارية الآن',
    running.map(t => t.title).slice(0,2).join(' · ') + (running.length > 2 ? ' وغيرها' : ''),'data-a="go" data-n="tasks"'); }
  if (un.length)      { any = 1; out += box('soon','i-assign',un.length,'مهمة تحتاج تسكينًا','الحد الأدنى ' + AR(MIN_ASSIGN) + ' محسنين لكل مهمة','data-a="go" data-n="tasks"'); }
  if (soon.length)    { any = 1; out += box('soon','i-clock',soon.length,'مهمة خلال ١٢ ساعة',
    soon.map(t => t.title + ' ' + t12(t.start)).slice(0,2).join(' · '),'data-a="go" data-n="tasks"'); }
  if (inbox)          { any = 1; out += box('soon','i-bell',inbox,'طلب بانتظار ردك','تسكين أو تفويض','data-a="go" data-n="requests"'); }
  if (tks)            { any = 1; out += box('','i-ticket',tks,'تذكرة مفتوحة','من الحجاج والكنترول والمحسنين','data-a="go" data-n="tickets"'); }
  if (!any) out += '<div class="note g">' + icon('i-checkc','s16') + '<span>لا يوجد ما يستدعي انتباهك الآن.</span></div>';
  return out;
}

      '<div class="sp"><div class="row"><b style="font-size:16px">' + E(u.name) + '</b>' + pill(u.kt, 'gold') + '</div>' +
      '<div class="sm dim">' + E(org.ar) + ' · ' + E(org.country) + '</div>' +
      (rt.n ? '<div style="margin-top:6px">' + stars(rt.avg) + '</div>' : '') + '</div></div></div>' +

    '<div class="banner bgw-haram"><span class="bt">' +
      '<b>' + E(dayName(now())) + ' · ' + hijri(now()) + '</b><span>' +
      AR(ts.filter(t => dayStart(t.start) === dayStart(now())).length) + ' مهمة اليوم</span></span></div>' +

    '<div class="grid3">' +

}

/* ============================ رئيسية المحسن ============================ */
function screenMuhsenHome() {
  const u = me(), L = userById(u.leaderId), t = currentTask();
  const rt = personRating(u.id);
  return bar('المهمة الحالية') + '<div class="view">' + ground() +
    '<div class="c gold"><div class="fl">' + avat(u, 'lg') +
      '<div class="sp"><div class="row"><b style="font-size:16px">' + E(u.name) + '</b>' + pill(u.code, 'gold') + '</div>' +
      '<div class="sm dim">' + E(u.specialty) + ' · فريق ' + E(L.name) + ' · ' + E(L.kt) + '</div>' +
      (rt.n ? '<div style="margin-top:6px">' + stars(rt.avg) + '</div>' : '') + '</div></div></div>' +

    statusBoxes() +

    (!t ? '<div class="c center" style="padding:30px 16px">' +
        '<div style="color:var(--dim2);margin-bottom:8px;display:flex;justify-content:center">' + icon('i-tasks','s26') + '</div>' +
        '<b>لا توجد مهمة حالية</b><div class="sm dim" style="margin-top:4px">ستظهر مهمتك هنا فور قبولك طلب تسكين.</div></div>'
      : muhsenTaskCard(t, u)) +
    '</div>' + tabs();
}

function muhsenTaskCard(t, u) {
  recomputeStatus(t);
  const a = acceptedSlots(t).find(x => x.muhsenId === u.id);
  const deleg = isDelegate(t, u.id);
  const doneSubs = t.subs.filter(s => s.done).length;
  let block = '';
  if (t.status === 'running') {
    block = '<div class="note g">' + icon('i-play','s16') + '<span>المهمة جارية — نفّذ المهام الفرعية.</span></div>' +
      '<button class="btn p" data-a="go" data-n="task" data-id="' + t.id + '">' + icon('i-tasks','s16') +
      'فتح المهام الفرعية (' + AR(doneSubs) + ' من ' + AR(t.subs.length) + ')</button>';
  } else {
    block = attendCard(t, u, deleg) ||
      '<div class="note b">' + icon('i-info','s16') + '<span>تبدأ المهمة ' + t12(t.start) + ' — ' + untilTxt(t.start) + '</span></div>';
  }
  return svcCard(t) + metaCard(t) +
    (deleg ? '<div class="note b">' + icon('i-shield','s16') +
      '<span>أُسندت إليك قيادة هذه المهمة — تبدأها وتغلقها، ولا تملك التسكين.</span></div>' : '') +
    '<div class="c">' +
      '<div class="row" style="margin-bottom:10px"><b class="sm">حجاج ' + E(t.kt) + '</b>' +
        pill(AR(ktCount(t.kt)) + ' حاجًا', 'gold') + '</div>' + block + '</div>' +
    '<button class="btn l" data-a="go" data-n="task" data-id="' + t.id + '">' +
      icon('i-tasks','s16') + 'تفاصيل المهمة</button>';
}

/* ============================ الطلبات — للمحسن ============================ */
function screenRequests() {
  const rq = myRequests();
  const u = me();
  const log = S.requests.filter(r => r.to === u.id || r.from === u.id).slice(0, 20);
  return bar('الطلبات') + '<div class="view">' + ground() +
    (rq.length ? rq.map(r => reqActionCard(r)).join('')
      : '<div class="c center" style="padding:30px 16px"><b>لا توجد طلبات معلّقة</b>' +
        '<div class="sm dim" style="margin-top:4px">ستصلك طلبات التسكين والتفويض هنا.</div></div>') +

/* ============================ التذاكر (تشمل ما كان يُسمّى تقارير) ============================ */
const PRI_C = { 'عاجلة':'no', 'متوسطة':'wait', 'عادية':'grey' };
const ST_C  = { 'مفتوحة':'wait', 'مُسندة':'blue', 'قيد المعالجة':'blue', 'مُصعّدة':'no', 'مغلقة':'live' };
const SRC_LBL = { 'حاج':'من حاج', 'كنترول':'من الكنترول', 'محسن':'من محسن', 'ليدر':'من الليدر' };

function screenTickets() {
  const L = isLeader();
  const f = S.tab.tk || 'open';
  let list = myTickets();
  if (f === 'open') list = list.filter(k => k.status !== 'مغلقة');
  else if (f === 'closed') list = list.filter(k => k.status === 'مغلقة');
  else if (f === 'mine') list = list.filter(k => k.assignedTo === S.session.id);
  else if (f === 'hajj') list = list.filter(k => k.src === 'حاج');
  else if (f === 'ctrl') list = list.filter(k => k.src === 'كنترول');
  else if (f === 'muh') list = list.filter(k => k.src === 'محسن');

  const segs = L ? [['open','المفتوحة'],['hajj','الحجاج'],['ctrl','الكنترول'],['muh','المحسنون'],['closed','المغلقة']]
                 : [['open','المفتوحة'],['mine','المسندة إليّ'],['closed','المغلقة']];

  return bar('التذاكر') + '<div class="view">' + ground() +
    '<button class="btn p" data-a="newticket">' + icon('i-plus','s16') +
      (L ? 'رفع تذكرة إلى الكنترول' : 'رفع تذكرة إلى الليدر') + '</button>' +
    (L ? '<div class="note b">' + icon('i-info','s16') +
      '<span>كل التذاكر تصل إليك — من الحجاج والكنترول والمحسنين. أسند ما تريد لمحسن بعينه.</span></div>' : '') +
    '<div class="seg">' + segs.map(x =>
      '<button class="' + (f === x[0] ? 'on' : '') + '" data-a="seg" data-k="tk" data-v="' + x[0] + '">' + x[1] + '</button>').join('') + '</div>' +
    (list.length ? list.map(k => ticketRow(k)).join('')
      : '<div class="c center dim sm" style="padding:24px">لا توجد تذاكر في هذا التصنيف</div>') +
    '</div>' + tabs();
}

function screenRating() {
  const u = me(), L = isLeader();
  const seg = S.tab.rt || 'mine';
  const rt = personRating(u.id);
  const rated = myTasks().filter(t => t.rating).sort((a, b) => b.rating.at - a.rating.at);

  let body = '';
  if (seg === 'mine') {
    body = '<div class="score"><span class="tiny dim2">تقييمك التراكمي</span>' +
      '<b>' + AR(String(rt.avg || 0).replace(/\.0$/, '')) + '</b>' +
      '<div class="bigstars">' + stars(rt.avg || 0, 'lg') + '</div>' +
      '<span class="tiny dim">من ' + AR(rt.n) + ' مهمة مقيَّمة</span></div>' +
      '<div class="note b">' + icon('i-info','s16') +
        '<span>التقييم متوسط عام لكل مهمة — يُحتسب من الالتزام بالأوقات وإنجاز المهام ورضا المستفيدين.</span></div>' +
      '<div class="lbl">تقييم كل مهمة</div>' +
      (rated.length ? rated.map(t => ratingRow(t)).join('')
        : '<div class="c center dim sm" style="padding:24px">لا توجد مهام مقيَّمة بعد</div>');

    const people = L ? teamOf(u.id) : S.users.filter(x => x.leaderId === u.leaderId && x.id !== u.id);
    const rows = people.map(p => ({ p, r: personRating(p.id) })).sort((a, b) => b.r.avg - a.r.avg);

      rows.map((x, i) => '<button class="c" data-a="go" data-n="profile" data-id="' + x.p.id + '" style="width:100%;text-align:right">' +

      '<button class="' + (seg === 'team' ? 'on' : '') + '" data-a="seg" data-k="rt" data-v="team">' + (L ? 'الفريق' : 'الزملاء') + '</button>' +
